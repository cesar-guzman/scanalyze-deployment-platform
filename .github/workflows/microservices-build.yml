name: Microservices build

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
    paths:
      - "backend/workers/scanalyze-ingest-api/**"
      - "backend/workers/scanalyze-ocr-worker/**"
      - "backend/workers/scanalyze-postprocess-worker/**"
      - "backend/workers/scanalyze-classifier-worker/**"
      - "backend/workers/scanalyze-bank-worker/**"
      - "backend/workers/scanalyze-personal-worker/**"
      - "backend/workers/scanalyze-gov-worker/**"
      - "scripts/microservices/**"
      - "tests/test_microservices/**"
      - "tooling/check_microservices.py"
      - ".gitignore"
      - "pyproject.toml"
      - ".github/workflows/microservices-build.yml"
  workflow_dispatch:
    inputs:
      customer_id:
        description: Protected GitHub Environment for the customer deployment
        required: true
        type: environment
      service:
        description: Service selection
        required: true
        default: all
        type: choice
        options:
          - all
          - ingest-api
          - ocr-worker
          - postprocess-worker
          - classifier-worker
          - bank-worker
          - personal-worker
          - gov-worker
      deployment_id:
        description: Deployment ID (must match the selected environment)
        required: true
        type: string
      aws_account_id:
        description: AWS account ID (must match the selected environment)
        required: true
        type: string
      aws_region:
        description: AWS region (must match the selected environment)
        required: true
        type: string
      ecr_prefix:
        description: Full ECR namespace, for example dep-.../scanalyze
        required: true
        type: string
      tag:
        description: Immutable tag; empty uses sha-<commit>
        required: false
        default: ""
        type: string
      push_images:
        description: Push images after validation
        required: true
        default: false
        type: boolean
      write_ssm:
        description: Write image tag and digest metadata after push
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  changes:
    name: Select services
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      services: ${{ steps.select.outputs.services }}
      publish_services: ${{ steps.select.outputs.publish_services }}
      has_changes: ${{ steps.select.outputs.has_changes }}
      publishable: ${{ steps.select.outputs.publishable }}
    steps:
      - name: Validate dispatch safety
        if: github.event_name == 'workflow_dispatch'
        env:
          CURRENT_REF: ${{ github.ref }}
          PUSH_IMAGES: ${{ inputs.push_images }}
          WRITE_SSM: ${{ inputs.write_ssm }}
        run: |
          set -euo pipefail
          if [[ "$WRITE_SSM" == "true" && "$PUSH_IMAGES" != "true" ]]; then
            echo "::error::write_ssm requires push_images"
            exit 1
          fi
          if [[ "$PUSH_IMAGES" == "true" && "$CURRENT_REF" != "refs/heads/main" ]]; then
            echo "::error::Publishing is restricted to refs/heads/main"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve service matrix
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SERVICE: ${{ inputs.service }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          publishable=false
          publish_services='[]'

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            services="$(scripts/microservices/changed-services.sh --all)"
            if [[ "$DISPATCH_SERVICE" == "all" ]]; then
              publish_services="$services"
            else
              publish_services="$(scripts/microservices/changed-services.sh --service "$DISPATCH_SERVICE")"
            fi
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            services="$(scripts/microservices/changed-services.sh --diff "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          else
            base_sha="$PUSH_BASE_SHA"
            if [[ "$base_sha" =~ ^0+$ ]]; then
              services="$(scripts/microservices/changed-services.sh --all)"
              publish_services="$services"
              publishable=true
            else
              services="$(scripts/microservices/changed-services.sh --diff "$base_sha" "$PUSH_HEAD_SHA")"
              publish_services="$(scripts/microservices/changed-services.sh --service-diff "$base_sha" "$PUSH_HEAD_SHA")"
              if [[ "$publish_services" != "[]" ]]; then
                publishable=true
              fi
            fi
          fi

          printf 'services=%s\n' "$services" >> "$GITHUB_OUTPUT"
          printf 'publish_services=%s\n' "$publish_services" >> "$GITHUB_OUTPUT"
          printf 'publishable=%s\n' "$publishable" >> "$GITHUB_OUTPUT"
          if [[ "$services" == "[]" ]]; then
            printf 'has_changes=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'has_changes=true\n' >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Service matrix evidence / ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.14"
          cache: pip
          cache-dependency-path: |
            backend/workers/scanalyze-${{ matrix.service }}/requirements.txt
            backend/workers/scanalyze-ocr-worker/requirements.lock
            backend/workers/scanalyze-classifier-worker/requirements.lock

      - name: Validate repository policy
        run: python tooling/check_microservices.py

      - name: Compile and test service
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_REGION: us-east-1
          SCANALYZE_ENV: ci
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          service_dir="backend/workers/scanalyze-${SERVICE}"
          case "$SERVICE" in
            bank-worker) service_tenant="bank" ;;
            personal-worker) service_tenant="personal" ;;
            gov-worker) service_tenant="gov" ;;
            *) service_tenant="platform" ;;
          esac
          export SCANALYZE_TENANT="$service_tenant"
          export SCANALYZE_TENANTS="$service_tenant"
          python -m compileall -q "$service_dir"
          case "$SERVICE" in
            ocr-worker|classifier-worker)
              python -m pip install --require-hashes -r "$service_dir/requirements.lock"
              ;;
            *)
              python -m pip install -r "$service_dir/requirements.txt"
              ;;
          esac
          python -m pip install \
            'jsonschema==4.26.0' \
            'pytest==9.1.1'
          PYTHONPATH="$service_dir/src:$service_dir" python -m pytest "$service_dir/tests" -q

      - name: Materialize approved hermetic base image
        if: matrix.service == 'ocr-worker' || matrix.service == 'classifier-worker'
        env:
          CI_BASE_IMAGE: ${{ vars.CI_BASE_IMAGE }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          if [[ -z "$CI_BASE_IMAGE" ]]; then
            echo "::error::CI_BASE_IMAGE is required when ${SERVICE} is selected"
            exit 1
          fi
          if [[ ! "$CI_BASE_IMAGE" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::CI_BASE_IMAGE must be an immutable sha256 reference"
            exit 1
          fi
          docker pull --platform linux/amd64 "$CI_BASE_IMAGE"
          docker image inspect "$CI_BASE_IMAGE" >/dev/null

      - name: Prepare OCR hermetic wheelhouse
        if: matrix.service == 'ocr-worker'
        env:
          CI_BASE_IMAGE: ${{ vars.CI_BASE_IMAGE }}
        run: |
          set -euo pipefail
          if [[ -z "$CI_BASE_IMAGE" ]]; then
            echo "::error::CI_BASE_IMAGE is required when ocr-worker is selected"
            exit 1
          fi
          scripts/microservices/prepare-ocr-wheelhouse.sh

      - name: Prepare classifier hermetic wheelhouse
        if: matrix.service == 'classifier-worker'
        env:
          CI_BASE_IMAGE: ${{ vars.CI_BASE_IMAGE }}
        run: |
          set -euo pipefail
          if [[ -z "$CI_BASE_IMAGE" ]]; then
            echo "::error::CI_BASE_IMAGE is required when classifier-worker is selected"
            exit 1
          fi
          scripts/microservices/prepare-classifier-wheelhouse.sh

      - name: Build without publishing
        env:
          CI_BASE_IMAGE: ${{ vars.CI_BASE_IMAGE }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          SCANALYZE_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          if [[ -z "$CI_BASE_IMAGE" ]]; then
            case "$SERVICE" in
              ocr-worker|classifier-worker)
                echo "::error::CI_BASE_IMAGE is required when ${SERVICE} is selected"
                exit 1
                ;;
            esac
            echo "::notice::Skipping Docker build: repository variable CI_BASE_IMAGE is not configured"
            echo "Code validation was performed by the compile-and-test step above"
            exit 0
          fi

          if [[ "$SERVICE" == "classifier-worker" ]]; then
            [[ "$(git rev-parse HEAD)" == "$SCANALYZE_SOURCE_REVISION" ]] || {
              echo "::error::classifier build revision must match checked-out HEAD"
              exit 1
            }
            [[ -z "$(git status --porcelain --untracked-files=normal)" ]] || {
              echo "::error::classifier hermetic build requires a clean worktree"
              exit 1
            }
            wheelhouse="backend/workers/scanalyze-classifier-worker/.wheelhouse"
            lock_file="backend/workers/scanalyze-classifier-worker/requirements.lock"
            marker="${wheelhouse}/.gug378-wheelhouse"
            [[ -d "$wheelhouse" && -f "$marker" ]] || {
              echo "::error::classifier wheelhouse was not prepared"
              exit 1
            }
            lock_digest="$(sha256sum "$lock_file" | awk '{print $1}')"
            expected_marker="$(printf 'lock_sha256=%s\ntarget=linux/amd64\npython=3.11.14' "$lock_digest")"
            [[ "$(<"$marker")" == "$expected_marker" ]] || {
              echo "::error::classifier wheelhouse does not match requirements.lock"
              exit 1
            }
            [[ "$(find "$wheelhouse" -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')" == "13" ]] || {
              echo "::error::classifier wheelhouse must contain exactly 13 wheels"
              exit 1
            }
            if find "$wheelhouse" -type l | grep -q .; then
              echo "::error::classifier wheelhouse must not contain symbolic links"
              exit 1
            fi
            source_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            [[ "$source_url" == "https://github.com/cesar-guzman/scanalyze-deployment-platform" ]] || {
              echo "::error::classifier source label must name the canonical repository"
              exit 1
            }
            created="$(git show -s --format=%cI "$SCANALYZE_SOURCE_REVISION")"
            image="scanalyze-ci/classifier-worker:sha-${SCANALYZE_SOURCE_REVISION:0:12}"
            docker image inspect "$CI_BASE_IMAGE" >/dev/null
            docker build \
              --platform linux/amd64 \
              --pull=false \
              --network=none \
              --build-arg "BASE_IMAGE=${CI_BASE_IMAGE}" \
              --label "org.opencontainers.image.source=${source_url}" \
              --label "org.opencontainers.image.revision=${SCANALYZE_SOURCE_REVISION}" \
              --label "org.opencontainers.image.created=${created}" \
              --tag "$image" \
              backend/workers/scanalyze-classifier-worker
            exit 0
          fi

          build_args=(
            --service "$SERVICE"
            --tag "sha-${SCANALYZE_SOURCE_REVISION:0:12}"
            --base-image "$CI_BASE_IMAGE"
            --no-push
            --no-write-ssm
          )
          if [[ "$SERVICE" == "ocr-worker" ]]; then
            build_args+=(--hermetic)
          fi
          scripts/microservices/build-push.sh "${build_args[@]}"

      - name: Verify OCR container evidence
        if: matrix.service == 'ocr-worker'
        env:
          SCANALYZE_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          image="scanalyze-ci/ocr-worker:sha-${SCANALYZE_SOURCE_REVISION:0:12}"
          scripts/microservices/verify-ocr-container.sh \
            --image "$image" \
            --revision "$SCANALYZE_SOURCE_REVISION"

      - name: Verify classifier container evidence
        if: matrix.service == 'classifier-worker'
        env:
          SCANALYZE_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          image="scanalyze-ci/classifier-worker:sha-${SCANALYZE_SOURCE_REVISION:0:12}"
          scripts/microservices/verify-classifier-container.sh \
            --image "$image" \
            --revision "$SCANALYZE_SOURCE_REVISION"

  tooling:
    name: Validate build tooling
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Run build-tool tests
        run: |
          set -euo pipefail
          python -m pip install '.[test]'
          python -m pytest tests/test_microservices -q

  validation_gate:
    name: Microservices validation gate
    needs:
      - changes
      - tooling
      - validate
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Enforce aggregate validation result
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          SERVICES_JSON: ${{ needs.changes.outputs.services }}
          HAS_CHANGES: ${{ needs.changes.outputs.has_changes }}
          TOOLING_RESULT: ${{ needs.tooling.result }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail

          summary_file="${GITHUB_STEP_SUMMARY:-/dev/null}"
          {
            printf '### Microservices validation gate\n\n'
            printf -- '- Service selection: `%s`\n' "$SELECTION_RESULT"
            printf -- '- Selected services: `%s`\n' "$SERVICES_JSON"
            printf -- '- Has service changes: `%s`\n' "$HAS_CHANGES"
            printf -- '- Build tooling: `%s`\n' "$TOOLING_RESULT"
            printf -- '- Service matrix: `%s`\n' "$VALIDATION_RESULT"
          } >> "$summary_file"

          fail() {
            printf '::error::%s\n' "$1"
            exit 1
          }

          [[ "$SELECTION_RESULT" == "success" ]] ||
            fail "service selection did not succeed: $SELECTION_RESULT"
          [[ "$TOOLING_RESULT" == "success" ]] ||
            fail "build tooling validation did not succeed: $TOOLING_RESULT"

          case "$HAS_CHANGES" in
            true)
              [[ -n "$SERVICES_JSON" && "$SERVICES_JSON" != "[]" ]] ||
                fail "has_changes=true requires a non-empty service matrix"
              [[ "$VALIDATION_RESULT" == "success" ]] ||
                fail "selected service validation did not succeed: $VALIDATION_RESULT"
              ;;
            false)
              [[ "$SERVICES_JSON" == "[]" ]] ||
                fail "has_changes=false requires an empty service matrix"
              [[ "$VALIDATION_RESULT" == "skipped" ]] ||
                fail "an empty service matrix must be skipped, got: $VALIDATION_RESULT"
              ;;
            *)
              fail "service selection produced an invalid has_changes value"
              ;;
          esac

  publish:
    name: Publication NO-GO / ${{ matrix.service }}
    needs:
      - changes
      - validation_gate
    if: >-
      needs.changes.result == 'success' &&
      needs.validation_gate.result == 'success' &&
      needs.changes.outputs.has_changes == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.push_images && github.ref == 'refs/heads/main') ||
        (github.event_name == 'push' && needs.changes.outputs.publishable == 'true' && vars.MAIN_PUBLISH_ENABLED == 'true')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.publish_services) }}
    steps:
      - name: Deny legacy publishing until the authorized release engine exists
        run: |
          set -euo pipefail
          echo "::error::Cloud publication is disabled until GUG-124 and GUG-125 connect the GUG-123 authorization chain."
          exit 1
