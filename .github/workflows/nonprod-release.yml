name: Non-production GitOps release

on:
  workflow_dispatch:
    inputs:
      request_path:
        description: Repository-relative Git-safe deployment request
        required: true
        default: examples/gitops/deployment-request.synthetic.json
        type: string
      deployment_id:
        description: Deployment ID from the Git-safe request
        required: true
        type: string
      logical_environment:
        description: Logical non-production stage recorded in the Git-safe request
        required: true
        default: sandbox
        type: choice
        options:
          - sandbox
          - dev
          - staging
      github_environment:
        description: Deployment-scoped protected GitHub Environment
        required: true
        type: environment
      aws_region:
        description: Region used for concurrency and future account binding
        required: true
        default: us-east-1
        type: string
      release_digest:
        description: Immutable release manifest digest from the Git-safe request
        required: true
        type: string
      dry_run:
        description: Validate the orchestrator without AWS, plans, or applies
        required: true
        default: true
        type: boolean
      allow_live:
        description: Enable one protected dev or staging saved-plan phase
        required: true
        default: false
        type: boolean
      live_operation:
        description: Separate live phase; plan and apply require distinct dispatches
        required: true
        default: none
        type: choice
        options:
          - none
          - plan
          - apply
      target_layer:
        description: Exact Terraform layer for a protected live phase
        required: true
        default: global
        type: choice
        options:
          - global
          - network
          - platform
          - data-foundation
          - cicd
          - identity-control-plane
          - services
          - edge-identity
          - edge
          - addons
      execution_id:
        description: Exact live execution ULID; unused by dry-run
        required: false
        type: string
      change_id:
        description: Exact live change ULID; unused by dry-run
        required: false
        type: string
      main_sha:
        description: Exact reviewed main SHA; required for live
        required: false
        type: string
      plan_record_digest:
        description: Exact saved-plan record digest; required only by apply
        required: false
        type: string
      reviewer_packet_digest:
        description: Exact reviewer-packet digest from the prior plan summary; required only by apply
        required: false
        type: string
      live_input_claim_digest:
        description: Exact tracked live-input claim digest; required only by live phases
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nonprod-release-${{ inputs.deployment_id }}-${{ inputs.aws_region }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate GitOps release request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          python -m pip install '.[test]'

      - name: Validate dispatch execution mode
        env:
          ALLOW_LIVE: ${{ inputs.allow_live }}
          CHANGE_ID: ${{ inputs.change_id }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          EXECUTION_ID: ${{ inputs.execution_id }}
          GITHUB_ENVIRONMENT_INPUT: ${{ inputs.github_environment }}
          LIVE_OPERATION: ${{ inputs.live_operation }}
          LIVE_INPUT_CLAIM_DIGEST: ${{ inputs.live_input_claim_digest }}
          LOGICAL_ENVIRONMENT: ${{ inputs.logical_environment }}
          MAIN_SHA: ${{ inputs.main_sha }}
          PLAN_RECORD_DIGEST: ${{ inputs.plan_record_digest }}
          REVIEWER_PACKET_DIGEST: ${{ inputs.reviewer_packet_digest }}
          REF_NAME: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          TARGET_LAYER: ${{ inputs.target_layer }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "::error::This release orchestrator can only be dispatched manually"
            exit 1
          fi
          if [[ "$DRY_RUN" == "$ALLOW_LIVE" ]]; then
            echo "::error::Exactly one of dry_run or allow_live must be true"
            exit 1
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            if [[ "$LIVE_OPERATION" != "none" || -n "$PLAN_RECORD_DIGEST" || \
                  -n "$REVIEWER_PACKET_DIGEST" || \
                  -n "$LIVE_INPUT_CLAIM_DIGEST" ]]; then
              echo "::error::Dry-run cannot carry live saved-plan inputs"
              exit 1
            fi
            exit 0
          fi

          if [[ "$LOGICAL_ENVIRONMENT" != "dev" && \
                "$LOGICAL_ENVIRONMENT" != "staging" ]]; then
            echo "::error::Live orchestration is restricted to dev or staging"
            exit 1
          fi
          case "$LIVE_OPERATION" in
            plan|apply) ;;
            *) echo "::error::Live orchestration requires plan or apply"; exit 1 ;;
          esac
          if [[ ! "$LIVE_INPUT_CLAIM_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Live orchestration requires one exact tracked input claim digest"
            exit 1
          fi
          case "$TARGET_LAYER" in
            global|network|platform|data-foundation|cicd|identity-control-plane|services|edge-identity|edge|addons) ;;
            *) echo "::error::Live target layer is not authorized"; exit 1 ;;
          esac
          if [[ "$REF_NAME" != "refs/heads/main" || "$REF_PROTECTED" != "true" ]]; then
            echo "::error::Live orchestration requires the protected main ref"
            exit 1
          fi
          if [[ ! "$MAIN_SHA" =~ ^[0-9a-f]{40}$ || "$RUN_SHA" != "$MAIN_SHA" ]]; then
            echo "::error::Live orchestration is not bound to the exact main SHA"
            exit 1
          fi
          if [[ "$RUN_ATTEMPT" != "1" ]]; then
            echo "::error::Live orchestration requires a fresh workflow run"
            exit 1
          fi
          if [[ ! "$EXECUTION_ID" =~ ^exec_[0-9A-HJKMNP-TV-Z]{26}$ ]] || \
             [[ ! "$CHANGE_ID" =~ ^chg_[0-9A-HJKMNP-TV-Z]{26}$ ]]; then
            echo "::error::Live execution identifiers are invalid"
            exit 1
          fi
          if [[ ! "$DEPLOYMENT_ID" =~ ^dep_[0-9A-HJKMNP-TV-Z]{26}$ ]]; then
            echo "::error::Live deployment identifier is invalid"
            exit 1
          fi
          if [[ "$GITHUB_ENVIRONMENT_INPUT" != "scanalyze-${DEPLOYMENT_ID}-dev" && \
                "$GITHUB_ENVIRONMENT_INPUT" != "scanalyze-${DEPLOYMENT_ID}-staging" ]] || \
             [[ "$GITHUB_ENVIRONMENT_INPUT" != \
                "scanalyze-${DEPLOYMENT_ID}-${LOGICAL_ENVIRONMENT}" ]]; then
            echo "::error::Protected Environment name is not canonical"
            exit 1
          fi
          if [[ "$LIVE_OPERATION" == "apply" ]]; then
            if [[ ! "$PLAN_RECORD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Apply requires one exact saved-plan record digest"
              exit 1
            fi
            if [[ ! "$REVIEWER_PACKET_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Apply requires the exact reviewer-packet digest from Plan"
              exit 1
            fi
          elif [[ "$LIVE_OPERATION" == "plan" && \
                  ( -n "$PLAN_RECORD_DIGEST" || -n "$REVIEWER_PACKET_DIGEST" ) ]]; then
            echo "::error::Plan cannot accept existing saved-plan selectors"
            exit 1
          fi

      - name: Validate canonical layer DAG
        run: |
          set -euo pipefail
          python scripts/deployment/validate-layer-dag.py deployment/layers.yaml

      - name: Validate request and input binding
        env:
          AWS_REGION_INPUT: ${{ inputs.aws_region }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          RELEASE_DIGEST: ${{ inputs.release_digest }}
          REQUEST_PATH: ${{ inputs.request_path }}
          LOGICAL_ENVIRONMENT: ${{ inputs.logical_environment }}
        run: |
          set -euo pipefail
          git ls-files --error-unmatch -- "$REQUEST_PATH" >/dev/null
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          import jsonschema
          import yaml

          deployment_id = os.environ["DEPLOYMENT_ID"]
          release_digest = os.environ["RELEASE_DIGEST"]
          region = os.environ["AWS_REGION_INPUT"]
          logical_environment = os.environ["LOGICAL_ENVIRONMENT"]

          if not re.fullmatch(r"dep_[0-9A-HJKMNP-TV-Z]{26}", deployment_id):
              raise SystemExit("ERROR: deployment_id is not a valid Scanalyze deployment ULID")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", release_digest):
              raise SystemExit("ERROR: release_digest must be a lowercase SHA-256 digest")
          if not re.fullmatch(r"[a-z]{2}(-gov)?-[a-z]+-[0-9]+", region):
              raise SystemExit("ERROR: aws_region is invalid")
          if logical_environment not in {"sandbox", "dev", "staging"}:
              raise SystemExit("ERROR: production is not supported by this workflow")

          repo = Path.cwd().resolve()
          supplied = Path(os.environ["REQUEST_PATH"])
          if supplied.is_absolute():
              raise SystemExit("ERROR: request_path must be repository-relative")
          request_path = (repo / supplied).resolve()
          try:
              request_path.relative_to(repo)
          except ValueError as exc:
              raise SystemExit("ERROR: request_path escapes the repository") from exc
          if not request_path.is_file():
              raise SystemExit("ERROR: deployment request does not exist")

          schema = json.loads(
              (repo / "schemas" / "deployment-request.schema.json").read_text(encoding="utf-8")
          )
          if request_path.suffix == ".json":
              request = json.loads(request_path.read_text(encoding="utf-8"))
          else:
              request = yaml.safe_load(request_path.read_text(encoding="utf-8"))

          validator = jsonschema.Draft202012Validator(
              schema,
              format_checker=jsonschema.FormatChecker(),
          )
          errors = list(validator.iter_errors(request))
          if errors:
              location = ".".join(str(part) for part in errors[0].absolute_path) or "root"
              raise SystemExit(f"ERROR: deployment request schema validation failed at {location}")

          expected = {
              "deployment_id": deployment_id,
              "environment": logical_environment,
              "release_digest": release_digest,
          }
          for field, value in expected.items():
              if request.get(field) != value:
                  raise SystemExit(f"ERROR: deployment request {field} does not match workflow input")

          selectors = request.get("non_sensitive_selectors", {})
          if selectors.get("region") != region:
              raise SystemExit("ERROR: deployment request region does not match workflow input")
          if request.get("full_deployment") is not True:
              raise SystemExit("ERROR: this workflow revision only supports full_deployment requests")

          print("PASS: request is Git-safe, schema-valid, and bound to dispatch inputs")
          PY

  go-no-go:
    name: Dispatch mode gate
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Confirm separated dry-run or live phase
        env:
          ALLOW_LIVE: ${{ inputs.allow_live }}
          DRY_RUN: ${{ inputs.dry_run }}
          LIVE_OPERATION: ${{ inputs.live_operation }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "$ALLOW_LIVE" ]]; then
            echo "::error::Exactly one execution mode must remain active"
            exit 1
          fi
          if [[ "$DRY_RUN" == "true" && "$LIVE_OPERATION" != "none" ]]; then
            echo "::error::Dry-run cannot select a live phase"
            exit 1
          fi
          if [[ "$ALLOW_LIVE" == "true" && "$LIVE_OPERATION" == "none" ]]; then
            echo "::error::Live mode requires a separately dispatched plan or apply phase"
            exit 1
          fi
          echo "GO: execution mode is explicit and fail-closed"

  live-layer:
    name: Protected ${{ inputs.logical_environment }} / ${{ inputs.live_operation }} / ${{ inputs.target_layer }}
    needs: go-no-go
    if: ${{ inputs.allow_live && !inputs.dry_run }}
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/_terraform-layer.yml
    with:
      deployment_id: ${{ inputs.deployment_id }}
      logical_environment: ${{ inputs.logical_environment }}
      layer: ${{ inputs.target_layer }}
      release_digest: ${{ inputs.release_digest }}
      request_path: ${{ inputs.request_path }}
      aws_region: ${{ inputs.aws_region }}
      dry_run: false
      allow_live: true
      live_operation: ${{ inputs.live_operation }}
      github_environment: ${{ inputs.github_environment }}
      main_sha: ${{ inputs.main_sha }}
      execution_id: ${{ inputs.execution_id }}
      change_id: ${{ inputs.change_id }}
      plan_record_digest: ${{ inputs.plan_record_digest }}
      reviewer_packet_digest: ${{ inputs.reviewer_packet_digest }}
      live_input_claim_digest: ${{ inputs.live_input_claim_digest }}

  account-ready-gate:
    name: 01 / Account readiness gate
    needs: go-no-go
    if: ${{ inputs.dry_run && !inputs.allow_live }}
    permissions:
      contents: read
    uses: ./.github/workflows/_terraform-layer.yml
    with:
      deployment_id: ${{ inputs.deployment_id }}
      logical_environment: ${{ inputs.logical_environment }}
      layer: account-ready-gate
      release_digest: ${{ inputs.release_digest }}
      request_path: ${{ inputs.request_path }}
      aws_region: ${{ inputs.aws_region }}
      dry_run: ${{ inputs.dry_run }}
      allow_live: ${{ inputs.allow_live }}

  global:
    name: 02 / Global
    needs: account-ready-gate
    if: ${{ inputs.dry_run && !inputs.allow_live }}
    permissions:
      contents: read
    uses: ./.github/workflows/_terraform-layer.yml
    with:
      deployment_id: ${{ inputs.deployment_id }}
      logical_environment: ${{ inputs.logical_environment }}
      layer: global
      release_digest: ${{ inputs.release_digest }}
      request_path: ${{ inputs.request_path }}
      aws_region: ${{ inputs.aws_region }}
      dry_run: ${{ inputs.dry_run }}
      allow_live: ${{ inputs.allow_live }}

  network:
    name: 03 / Network
    needs: global
    if: ${{ inputs.dry_run && !inputs.allow_live }}
    permissions:
      contents: read
    uses: ./.github/workflows/_terraform-layer.yml
    with:
      deployment_id: ${{ inputs.deployment_id }}
      logical_environment: ${{ inputs.logical_environment }}
      layer: network
      release_digest: ${{ inputs.release_digest }}
      request_path: ${{ inputs.request_path }}
      aws_region: ${{ inputs.aws_region }}
      dry_run: ${{ inputs.dry_run }}
      allow_live: ${{ inputs.allow_live }}

  platform:
    name: 04 / Platform
    needs: network
    if: ${{ inputs.dry_run && !inputs.allow_live }}
    permissions:
      contents: read
    uses: ./.github/workflows/_terraform-layer.yml
    with:
      deployment_id: ${{ inputs.deployment_id }}
      logical_environment: ${{ inputs.logical_environment }}
      layer: platform
      release_digest: ${{ inputs.release_digest }}
      request_path: ${{ inputs.request_path }}
      aws_region: ${{ inputs.aws_region }}
      dry_run: ${{ inputs.dry_run }}
      allow_live: ${{ inputs.allow_live }}

  data-foundation:
    name: 05 / Data foundation
    needs: platform
    if: ${{ inputs.dry_run && !inputs.allow_live }}
    permissions:
      contents: read
    uses: ./.github/workflows/_terraform-layer.yml
    with:
      deployment_id: ${{ inputs.deployment_id }}
      logical_environment: ${{ inputs.logical_environment }}
      layer: data-foundation
      release_digest: ${{ inputs.release_digest }}
      request_path: ${{ inputs.request_path }}
      aws_region: ${{ inputs.aws_region }}
      dry_run: ${{ inputs.dry_run }}
      allow_live: ${{ inputs.allow_live }}

  cicd:
    name: 06 / CI/CD foundation
    needs: data-foundation
    if: ${{ inputs.dry_run && !inputs.allow_live }}
    permissions:
      contents: read
    uses: ./.github/workflows/_terraform-layer.yml
    with:
      deployment_id: ${{ inputs.deployment_id }}
      logical_environment: ${{ inputs.logical_environment }}
      layer: cicd
      release_digest: ${{ inputs.release_digest }}
      request_path: ${{ inputs.request_path }}
      aws_region: ${{ inputs.aws_region }}
      dry_run: ${{ inputs.dry_run }}
      allow_live: ${{ inputs.allow_live }}

  artifact-publication:
    name: 07 / Artifact publication (dry-run)
    needs: cicd
    if: ${{ inputs.dry_run && !inputs.allow_live }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate publication boundary
        env:
          ALLOW_LIVE: ${{ inputs.allow_live }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_DIGEST: ${{ inputs.release_digest }}
        run: |
          set -euo pipefail
          if [[ "$ALLOW_LIVE" != "false" || "$DRY_RUN" != "true" ]]; then
            echo "::error::Artifact publication is not authorized"
            exit 1
          fi
          if [[ ! "$RELEASE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::release_digest is invalid"
            exit 1
          fi
          test -f scripts/supply-chain/release-graph.py
          test -x scripts/supply-chain/generate-sbom.sh
          test -x scripts/supply-chain/scan-image.sh
          test -x scripts/supply-chain/sign-image.sh
          test -x scripts/supply-chain/verify-image.sh
          {
            echo "### Artifact publication"
            echo '- Registry login: not performed'
            echo '- Build/push/sign: not performed'
            echo '- AWS access: none'
            echo '- Status: `DRY_RUN_VALIDATED`'
          } >> "$GITHUB_STEP_SUMMARY"

  identity-control-plane:
    name: 08 / Identity control plane
    needs: artifact-publication
    if: ${{ inputs.dry_run && !inputs.allow_live }}
    permissions:
      contents: read
    uses: ./.github/workflows/_terraform-layer.yml
    with:
      deployment_id: ${{ inputs.deployment_id }}
      logical_environment: ${{ inputs.logical_environment }}
      layer: identity-control-plane
      release_digest: ${{ inputs.release_digest }}
      request_path: ${{ inputs.request_path }}
      aws_region: ${{ inputs.aws_region }}
      dry_run: ${{ inputs.dry_run }}
      allow_live: ${{ inputs.allow_live }}

  services:
    name: 09 / Services
    needs: identity-control-plane
    if: ${{ inputs.dry_run && !inputs.allow_live }}
    permissions:
      contents: read
    uses: ./.github/workflows/_terraform-layer.yml
    with:
      deployment_id: ${{ inputs.deployment_id }}
      logical_environment: ${{ inputs.logical_environment }}
      layer: services
      release_digest: ${{ inputs.release_digest }}
      request_path: ${{ inputs.request_path }}
      aws_region: ${{ inputs.aws_region }}
      dry_run: ${{ inputs.dry_run }}
      allow_live: ${{ inputs.allow_live }}

  edge-identity:
    name: 10 / Edge identity
    needs: services
    if: ${{ inputs.dry_run && !inputs.allow_live }}
    permissions:
      contents: read
    uses: ./.github/workflows/_terraform-layer.yml
    with:
      deployment_id: ${{ inputs.deployment_id }}
      logical_environment: ${{ inputs.logical_environment }}
      layer: edge-identity
      release_digest: ${{ inputs.release_digest }}
      request_path: ${{ inputs.request_path }}
      aws_region: ${{ inputs.aws_region }}
      dry_run: ${{ inputs.dry_run }}
      allow_live: ${{ inputs.allow_live }}

  edge:
    name: 11 / Edge
    needs: edge-identity
    if: ${{ inputs.dry_run && !inputs.allow_live }}
    permissions:
      contents: read
    uses: ./.github/workflows/_terraform-layer.yml
    with:
      deployment_id: ${{ inputs.deployment_id }}
      logical_environment: ${{ inputs.logical_environment }}
      layer: edge
      release_digest: ${{ inputs.release_digest }}
      request_path: ${{ inputs.request_path }}
      aws_region: ${{ inputs.aws_region }}
      dry_run: ${{ inputs.dry_run }}
      allow_live: ${{ inputs.allow_live }}

  addons:
    name: 12 / Addons
    needs: edge
    if: ${{ inputs.dry_run && !inputs.allow_live }}
    permissions:
      contents: read
    uses: ./.github/workflows/_terraform-layer.yml
    with:
      deployment_id: ${{ inputs.deployment_id }}
      logical_environment: ${{ inputs.logical_environment }}
      layer: addons
      release_digest: ${{ inputs.release_digest }}
      request_path: ${{ inputs.request_path }}
      aws_region: ${{ inputs.aws_region }}
      dry_run: ${{ inputs.dry_run }}
      allow_live: ${{ inputs.allow_live }}

  synthetic-validation:
    name: 13 / Synthetic validation and evidence
    needs: addons
    if: ${{ inputs.dry_run && !inputs.allow_live }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          python -m pip install '.[test]'

      - name: Revalidate DAG and repository safety
        run: |
          set -euo pipefail
          python scripts/deployment/validate-layer-dag.py deployment/layers.yaml
          make git-safety

      - name: Generate sanitized evidence
        env:
          AWS_REGION_INPUT: ${{ inputs.aws_region }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          RELEASE_DIGEST: ${{ inputs.release_digest }}
          LOGICAL_ENVIRONMENT: ${{ inputs.logical_environment }}
        run: |
          set -euo pipefail
          evidence_path="$RUNNER_TEMP/nonprod-dry-run-evidence.json"
          export EVIDENCE_PATH="$evidence_path"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          evidence = {
              "schema_version": "1",
              "workflow": "nonprod-release",
              "mode": "dry-run",
              "environment": os.environ["LOGICAL_ENVIRONMENT"],
              "region": os.environ["AWS_REGION_INPUT"],
              "deployment_id_sha256": hashlib.sha256(
                  os.environ["DEPLOYMENT_ID"].encode("utf-8")
              ).hexdigest(),
              "release_digest": os.environ["RELEASE_DIGEST"],
              "commit": os.environ["GITHUB_SHA"],
              "stages": [
                  "account-ready-gate",
                  "global",
                  "network",
                  "platform",
                  "data-foundation",
                  "cicd",
                  "artifact-publication",
                  "identity-control-plane",
                  "services",
                  "edge-identity",
                  "edge",
                  "addons",
                  "synthetic-validation",
              ],
              "aws_api_calls": False,
              "terraform_backend": False,
              "terraform_plan": False,
              "terraform_apply": False,
              "artifact_publication": False,
              "live_validation": "PENDING",
              "production_readiness": "NO-GO",
          }
          output = Path(os.environ["EVIDENCE_PATH"])
          output.write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          output.chmod(0o600)
          PY
          {
            echo "### Non-production orchestration result"
            echo '- Canonical stages: 13/13 offline validations completed'
            echo '- AWS API calls: none'
            echo '- Artifact publication: not executed'
            echo '- Terraform plan/apply: not executed'
            echo '- Live validation: `PENDING`'
            echo '- Production readiness: `NO-GO`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nonprod-dry-run-evidence
          path: ${{ runner.temp }}/nonprod-dry-run-evidence.json
          if-no-files-found: error
          retention-days: 14
