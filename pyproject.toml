[project]
name = "scanalyze-deployment-platform"
version = "0.1.0"
description = "Scanalyze Dedicated Deployment Platform — schemas, policies, tests, and tooling"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
    "boto3==1.42.57",
    "botocore==1.42.97",
    "jmespath==1.1.0",
    "s3transfer==0.16.1",
    "cryptography==48.0.1",
    "fastapi==0.111.0",
    "jsonschema==4.26.0",
    "pydantic==2.7.4",
    "pydantic-settings>=2.2,<3.0",
    "PyJWT[crypto]>=2.8,<3.0",
    "pytest==9.1.1",
    "pypdf==5.1.0",
    "python-dateutil==2.9.0.post0",
    "six==1.17.0",
    "pyyaml==6.0.2",
    "structlog>=24.1,<26.0",
    "urllib3==2.7.0",
]
docs = [
    "python-docx==1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
include = ["tooling*"]
