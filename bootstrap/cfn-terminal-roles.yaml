AWSTemplateFormatVersion: '2010-09-09'
Description: Scanalyze content-addressed terminal-role companion for the ACCOUNT_READY v2 destination
  baseline.
Metadata:
  Scanalyze: {Contract: account-ready/v2-terminal-roles, PolicyBundleSha256: 'sha256:79634f20c3dafcdd861d853f7f193e28ad3a1016af13886b3d5eb957907c022c',
    Ownership: external-account-baseline}
Parameters:
  CustomerId: {Type: String, AllowedPattern: '^cust_[0-9A-HJKMNP-TV-Z]{26}$'}
  DeploymentId: {Type: String, AllowedPattern: '^dep_[0-9A-HJKMNP-TV-Z]{26}$'}
  SharedServicesAccountId: {Type: String, AllowedPattern: '^(?!000000000000$)[0-9]{12}$'}
  Environment:
    Type: String
    AllowedValues: [sandbox, dev, staging, production]
  StateBucketArn: {Type: String, AllowedPattern: '^arn:aws(?:-[a-z]+)*:s3:::[a-z0-9.-]+-tf-state$'}
  PlanBucketArn: {Type: String, AllowedPattern: '^arn:aws(?:-[a-z]+)*:s3:::[a-z0-9.-]+-tf-plan$'}
  EvidenceBucketArn: {Type: String, AllowedPattern: '^arn:aws(?:-[a-z]+)*:s3:::[a-z0-9.-]+-tf-evidence$'}
  ContractsBucketArn: {Type: String, AllowedPattern: '^arn:aws(?:-[a-z]+)*:s3:::[a-z0-9.-]+-contracts$'}
  StateKmsKeyArn: {Type: String, AllowedPattern: '^arn:aws(?:-[a-z]+)*:kms:[a-z0-9-]+:[0-9]{12}:key/.+$'}
  EvidenceKmsKeyArn: {Type: String, AllowedPattern: '^arn:aws(?:-[a-z]+)*:kms:[a-z0-9-]+:[0-9]{12}:key/.+$'}
  ContractsKmsKeyArn: {Type: String, AllowedPattern: '^arn:aws(?:-[a-z]+)*:kms:[a-z0-9-]+:[0-9]{12}:key/.+$'}
Rules:
  SharedServicesMustBeExternal:
    Assertions:
    - Assert: !Not [!Equals [!Ref 'SharedServicesAccountId', !Ref 'AWS::AccountId']]
      AssertDescription: SharedServicesAccountId must differ from the destination account.
Resources:
  PlanPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'ScanalyzeCustomer-Plan-${DeploymentId}'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: ListRegionalState
          Effect: Allow
          Action: ['s3:ListBucket', 's3:ListBucketVersions']
          Resource: !Sub '${StateBucketArn}'
          Condition:
            StringEquals:
              aws:PrincipalTag/operation: plan
              aws:PrincipalTag/layer: [network, platform, data-foundation, cicd, services, edge-identity,
                addons]
            StringLike:
              s3:prefix: [!Sub '${DeploymentId}/${AWS::Region}/${!aws:PrincipalTag/layer}/terraform.tfstate',
                !Sub '${DeploymentId}/${AWS::Region}/${!aws:PrincipalTag/layer}/terraform.tfstate.tflock']
        - Sid: ReadRegionalState
          Effect: Allow
          Action: ['s3:GetObject', 's3:GetObjectVersion']
          Resource: !Sub '${StateBucketArn}/${DeploymentId}/${AWS::Region}/${!aws:PrincipalTag/layer}/terraform.tfstate'
          Condition:
            StringEquals:
              aws:PrincipalTag/operation: plan
              aws:PrincipalTag/layer: [network, platform, data-foundation, cicd, services, edge-identity,
                addons]
        - Sid: ManageRegionalLockfile
          Effect: Allow
          Action: ['s3:DeleteObject', 's3:GetObject', 's3:PutObject']
          Resource: !Sub '${StateBucketArn}/${DeploymentId}/${AWS::Region}/${!aws:PrincipalTag/layer}/terraform.tfstate.tflock'
          Condition:
            StringEquals:
              aws:PrincipalTag/operation: plan
              aws:PrincipalTag/layer: [network, platform, data-foundation, cicd, services, edge-identity,
                addons]
        - Sid: ListGlobalState
          Effect: Allow
          Action: ['s3:ListBucket', 's3:ListBucketVersions']
          Resource: !Sub '${StateBucketArn}'
          Condition:
            StringEquals:
              aws:PrincipalTag/operation: plan
              aws:PrincipalTag/layer: [global, edge]
            StringLike:
              s3:prefix: [!Sub '${DeploymentId}/${!aws:PrincipalTag/layer}/terraform.tfstate', !Sub '${DeploymentId}/${!aws:PrincipalTag/layer}/terraform.tfstate.tflock']
        - Sid: ReadGlobalState
          Effect: Allow
          Action: ['s3:GetObject', 's3:GetObjectVersion']
          Resource: !Sub '${StateBucketArn}/${DeploymentId}/${!aws:PrincipalTag/layer}/terraform.tfstate'
          Condition:
            StringEquals:
              aws:PrincipalTag/operation: plan
              aws:PrincipalTag/layer: [global, edge]
        - Sid: ManageGlobalLockfile
          Effect: Allow
          Action: ['s3:DeleteObject', 's3:GetObject', 's3:PutObject']
          Resource: !Sub '${StateBucketArn}/${DeploymentId}/${!aws:PrincipalTag/layer}/terraform.tfstate.tflock'
          Condition:
            StringEquals:
              aws:PrincipalTag/operation: plan
              aws:PrincipalTag/layer: [global, edge]
        - Sid: WriteOwnSavedPlan
          Effect: Allow
          Action: ['s3:GetObject', 's3:PutObject']
          Resource: !Sub '${PlanBucketArn}/plan-execution/${DeploymentId}/${!aws:PrincipalTag/change_id}/${!aws:PrincipalTag/layer}/plan.tfplan'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': plan}
        - Sid: ReadContracts
          Effect: Allow
          Action: ['s3:GetObject', 's3:GetObjectVersion']
          Resource: !Sub '${ContractsBucketArn}/${DeploymentId}/*'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': plan}
        - Sid: ReadContractParameters
          Effect: Allow
          Action: ['ssm:GetParameter', 'ssm:GetParameters', 'ssm:GetParametersByPath']
          Resource: [!Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${DeploymentId}/*',
            !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/scanalyze/deployments/${DeploymentId}/contracts/*']
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': plan}
        - Sid: ReadTerraformManagedInfrastructure
          Effect: Allow
          Action: ['acm:DescribeCertificate', 'acm:ListTagsForCertificate', 'apigateway:GET', 'cloudfront:Get*',
            'cloudfront:ListTagsForResource', 'cloudwatch:Describe*', 'cloudwatch:GetDashboard', 'cloudwatch:GetMetric*',
            'cloudwatch:ListMetrics', 'cloudwatch:ListTagsForResource', 'codebuild:BatchGetProjects',
            'codebuild:ListProjects', 'codecommit:GetRepository', 'codecommit:ListTagsForResource', 'codepipeline:GetPipeline',
            'codepipeline:GetPipelineState', 'codepipeline:ListTagsForResource', 'dynamodb:Describe*',
            'dynamodb:ListTagsOfResource', 'ec2:Describe*', 'ecr:Describe*', 'ecr:GetLifecyclePolicy',
            'ecr:GetRepositoryPolicy', 'ecr:ListTagsForResource', 'ecs:Describe*', 'ecs:List*', 'elasticloadbalancing:Describe*',
            'iam:Get*', 'iam:List*', 'kms:Describe*', 'kms:GetKeyPolicy', 'kms:GetKeyRotationStatus',
            'kms:List*', 'logs:Describe*', 'logs:ListTagsForResource', 'route53:Get*', 'route53:List*',
            's3:GetBucket*', 's3:ListAllMyBuckets', 's3:ListBucket', 'sns:GetTopicAttributes', 'sns:ListTagsForResource',
            'sqs:GetQueue*', 'sqs:ListQueueTags', 'sqs:ListQueues', 'wafv2:Get*', 'wafv2:List*', 'sts:GetCallerIdentity']
          Resource: '*'
          Condition:
            StringEquals:
              aws:PrincipalTag/deployment_id: !Sub '${DeploymentId}'
              aws:PrincipalTag/operation: plan
              aws:PrincipalTag/layer: [global, network, platform, data-foundation, cicd, services, edge-identity,
                edge, addons]
        - Sid: UsePlanBaselineKeys
          Effect: Allow
          Action: ['kms:Decrypt', 'kms:DescribeKey', 'kms:Encrypt', 'kms:GenerateDataKey']
          Resource: [!Sub '${StateKmsKeyArn}', !Sub '${ContractsKmsKeyArn}']
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': plan}
        - Sid: EncryptExactSavedPlan
          Effect: Allow
          Action: ['kms:Decrypt', 'kms:Encrypt', 'kms:GenerateDataKey']
          Resource: !Sub '${EvidenceKmsKeyArn}'
          Condition:
            StringEquals:
              aws:PrincipalTag/operation: plan
              aws:PrincipalTag/layer: [global, network, platform, data-foundation, cicd, services, edge-identity,
                edge, addons]
              kms:ViaService: !Sub 's3.${AWS::Region}.${AWS::URLSuffix}'
              kms:EncryptionContext:aws:s3:arn: !Sub '${PlanBucketArn}'
        - {Sid: DenyTerminalRoleChaining, Effect: Deny, Action: 'sts:AssumeRole', Resource: '*'}
  IdentityPlanPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'ScanalyzeCustomer-IdentityPlan-${DeploymentId}'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: ListIdentityState
          Effect: Allow
          Action: ['s3:ListBucket', 's3:ListBucketVersions']
          Resource: !Sub '${StateBucketArn}'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': plan, 'aws:PrincipalTag/layer': identity-control-plane}
            StringLike:
              s3:prefix: [!Sub '${DeploymentId}/${AWS::Region}/identity-control-plane/terraform.tfstate',
                !Sub '${DeploymentId}/${AWS::Region}/identity-control-plane/terraform.tfstate.tflock']
        - Sid: ReadIdentityLayerState
          Effect: Allow
          Action: ['s3:GetObject', 's3:GetObjectVersion']
          Resource: !Sub '${StateBucketArn}/${DeploymentId}/${AWS::Region}/identity-control-plane/terraform.tfstate'
        - Sid: ManageIdentityLayerLock
          Effect: Allow
          Action: ['s3:GetObject', 's3:PutObject', 's3:DeleteObject']
          Resource: !Sub '${StateBucketArn}/${DeploymentId}/${AWS::Region}/identity-control-plane/terraform.tfstate.tflock'
        - Sid: WriteIdentityPlanExecutionZone
          Effect: Allow
          Action: ['s3:GetObject', 's3:PutObject']
          Resource: !Sub '${PlanBucketArn}/plan-execution/${DeploymentId}/${!aws:PrincipalTag/change_id}/identity-control-plane/plan.tfplan'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': plan, 'aws:PrincipalTag/layer': identity-control-plane}
        - Sid: UseStateKeyForIdentityPlan
          Effect: Allow
          Action: ['kms:Decrypt', 'kms:DescribeKey', 'kms:Encrypt', 'kms:GenerateDataKey']
          Resource: [!Sub '${StateKmsKeyArn}']
        - Sid: EncryptExactIdentitySavedPlan
          Effect: Allow
          Action: ['kms:Decrypt', 'kms:Encrypt', 'kms:GenerateDataKey']
          Resource: !Sub '${EvidenceKmsKeyArn}'
          Condition:
            StringEquals:
              aws:PrincipalTag/operation: plan
              aws:PrincipalTag/layer: identity-control-plane
              kms:ViaService: !Sub 's3.${AWS::Region}.${AWS::URLSuffix}'
              kms:EncryptionContext:aws:s3:arn: !Sub '${PlanBucketArn}'
        - Sid: ReadIdentityContractsAndArtifacts
          Effect: Allow
          Action: ['s3:GetObject', 'ssm:GetParameter', 'ssm:GetParameters', 'ssm:GetParametersByPath']
          Resource: [!Sub '${ContractsBucketArn}/${DeploymentId}/identity-control-plane/*', !Sub 'arn:${AWS::Partition}:s3:::scanalyze-shared-releases/*',
            !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/scanalyze/deployments/${DeploymentId}/contracts/*']
        - Sid: ReadDeploymentIdentityResources
          Effect: Allow
          Action: ['cloudwatch:DescribeAlarms', 'cognito-idp:DescribeUserPool',
            'cognito-idp:DescribeUserPoolDomain', 'cognito-idp:GetGroup', 'cognito-idp:ListGroups', 'dynamodb:DescribeTable',
            'iam:GetRole', 'iam:GetRolePolicy', 'lambda:GetAlias', 'lambda:GetFunction', 'lambda:GetPolicy',
            'logs:DescribeLogGroups', 'sqs:GetQueueAttributes', 'sqs:GetQueueUrl']
          Resource: '*'
        - Sid: ValidateIdentityDestinationAccount
          Effect: Allow
          Action: sts:GetCallerIdentity
          Resource: '*'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': plan, 'aws:PrincipalTag/layer': identity-control-plane}
        - Sid: DecryptIdentityContracts
          Effect: Allow
          Action: ['kms:Decrypt', 'kms:DescribeKey']
          Resource: [!Sub '${StateKmsKeyArn}', !Sub '${ContractsKmsKeyArn}']
  PromotionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'ScanalyzeCustomer-Promotion-${DeploymentId}'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: ReadPromotionInputs
          Effect: Allow
          Action: ['s3:GetObject', 's3:GetObjectVersion']
          Resource: [!Sub '${EvidenceBucketArn}/evidence/${DeploymentId}/*', !Sub '${ContractsBucketArn}/${DeploymentId}/*']
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': promote, 'aws:PrincipalTag/layer': artifact-publication}
        - Sid: PublishImages
          Effect: Allow
          Action: ['ecr:BatchCheckLayerAvailability', 'ecr:BatchGetImage', 'ecr:CompleteLayerUpload',
            'ecr:GetDownloadUrlForLayer', 'ecr:InitiateLayerUpload', 'ecr:PutImage', 'ecr:UploadLayerPart']
          Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/scanalyze/*'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': promote, 'aws:PrincipalTag/layer': artifact-publication}
        - Sid: GetEcrAuthorizationToken
          Effect: Allow
          Action: ecr:GetAuthorizationToken
          Resource: '*'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': promote, 'aws:PrincipalTag/layer': artifact-publication}
        - Sid: PublishFrontendRelease
          Effect: Allow
          Action: ['s3:GetObject', 's3:ListBucket', 's3:PutObject']
          Resource: [!Sub 'arn:${AWS::Partition}:s3:::scanalyze-${AWS::AccountId}-frontend', !Sub 'arn:${AWS::Partition}:s3:::scanalyze-${AWS::AccountId}-frontend/releases/${DeploymentId}/*']
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': promote, 'aws:PrincipalTag/layer': artifact-publication}
        - Sid: InvalidateExactDistribution
          Effect: Allow
          Action: ['cloudfront:CreateInvalidation', 'cloudfront:GetInvalidation']
          Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': promote, 'aws:PrincipalTag/layer': artifact-publication,
              'aws:ResourceTag/deployment_id': !Sub '${DeploymentId}'}
        - Sid: UsePromotionInputKeys
          Effect: Allow
          Action: ['kms:Decrypt', 'kms:DescribeKey']
          Resource: [!Sub '${EvidenceKmsKeyArn}', !Sub '${ContractsKmsKeyArn}']
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': promote, 'aws:PrincipalTag/layer': artifact-publication}
        - Sid: DenyPromotionInfrastructureAndState
          Effect: Deny
          Action: ['cloudformation:*', 'dynamodb:*', 'ec2:*', 'ecs:*', 'iam:*', 'organizations:*', 'sqs:*',
            'ssm:PutParameter', 'sts:AssumeRole']
          Resource: '*'
  ValidationPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'ScanalyzeCustomer-Validation-${DeploymentId}'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: ReadOnlyValidationHealth
          Effect: Allow
          Action: ['cloudwatch:DescribeAlarms', 'cloudwatch:GetMetricData', 'dynamodb:DescribeTable',
            'ecs:DescribeServices', 'ecs:DescribeTaskDefinition', 'ecs:DescribeTasks', 'ecs:ListTasks',
            'elasticloadbalancing:DescribeTargetGroups', 'elasticloadbalancing:DescribeTargetHealth',
            'sqs:GetQueueAttributes']
          Resource: '*'
          Condition:
            StringEquals:
              aws:PrincipalTag/operation: validate
              aws:PrincipalTag/layer: [artifact-publication, synthetic-validation]
        - Sid: ReadDeploymentValidationLogs
          Effect: Allow
          Action: ['logs:FilterLogEvents', 'logs:GetLogEvents']
          Resource: [!Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${DeploymentId}-*',
            !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${DeploymentId}-*:log-stream:*',
            !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${DeploymentId}-identity-*',
            !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${DeploymentId}-identity-*:log-stream:*',
            !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${DeploymentId}/*',
            !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${DeploymentId}/*:log-stream:*']
          Condition:
            StringEquals:
              aws:PrincipalTag/operation: validate
              aws:PrincipalTag/layer: [artifact-publication, synthetic-validation]
        - Sid: ReadDeploymentValidationParameters
          Effect: Allow
          Action: ['ssm:GetParameter', 'ssm:GetParameters']
          Resource: [!Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/scanalyze/deployments/${DeploymentId}/*',
            !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${DeploymentId}/*']
          Condition:
            StringEquals:
              aws:PrincipalTag/operation: validate
              aws:PrincipalTag/layer: [artifact-publication, synthetic-validation]
        - Sid: ReadValidationArtifacts
          Effect: Allow
          Action: ['ecr:BatchCheckLayerAvailability', 'ecr:BatchGetImage', 'ecr:DescribeImages', 'ecr:GetDownloadUrlForLayer']
          Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/scanalyze/*'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': validate, 'aws:PrincipalTag/layer': artifact-publication}
        - Sid: GetValidationEcrAuthorizationToken
          Effect: Allow
          Action: ecr:GetAuthorizationToken
          Resource: '*'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': validate, 'aws:PrincipalTag/layer': artifact-publication}
        - Sid: ReadValidationInputs
          Effect: Allow
          Action: ['s3:GetObject', 's3:GetObjectVersion']
          Resource: [!Sub '${EvidenceBucketArn}/evidence/${DeploymentId}/*', !Sub '${ContractsBucketArn}/${DeploymentId}/*']
          Condition:
            StringEquals:
              aws:PrincipalTag/operation: validate
              aws:PrincipalTag/layer: [artifact-publication, synthetic-validation]
        - Sid: DecryptValidationInputs
          Effect: Allow
          Action: ['kms:Decrypt', 'kms:DescribeKey']
          Resource: [!Sub '${EvidenceKmsKeyArn}', !Sub '${ContractsKmsKeyArn}']
          Condition:
            StringEquals:
              aws:PrincipalTag/operation: validate
              aws:PrincipalTag/layer: [artifact-publication, synthetic-validation]
        - Sid: DenyValidationWritesAndRoleChaining
          Effect: Deny
          Action: ['cloudformation:*', 'cloudfront:Create*', 'cloudfront:Update*', 'dynamodb:Delete*',
            'dynamodb:Put*', 'dynamodb:Update*', 'ec2:Create*', 'ec2:Delete*', 'ec2:Modify*', 'ecr:CompleteLayerUpload',
            'ecr:InitiateLayerUpload', 'ecr:PutImage', 'ecr:UploadLayerPart', 'ecs:Create*', 'ecs:Delete*',
            'ecs:RegisterTaskDefinition', 'ecs:RunTask', 'ecs:Update*', 'iam:*', 's3:Delete*', 's3:Put*',
            'sqs:Delete*', 'sqs:PurgeQueue', 'sqs:SendMessage', 'ssm:PutParameter', 'sts:AssumeRole']
          Resource: '*'
  DiagnosticPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'ScanalyzeCustomer-Diagnostic-${DeploymentId}'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: ReadDeploymentResourcesForDiagnostic
          Effect: Allow
          Action: ['acm:Describe*', 'apigateway:GET', 'cloudfront:Get*', 'cloudwatch:Describe*', 'cloudwatch:GetMetric*',
            'cognito-idp:DescribeUserPool', 'cognito-idp:DescribeUserPoolDomain', 'dynamodb:Describe*', 'ec2:Describe*', 'ecs:Describe*', 'ecs:List*',
            'elasticloadbalancing:Describe*', 'iam:Get*', 'iam:List*', 'kms:Describe*', 'kms:List*', 'lambda:Get*',
            'logs:Describe*', 'logs:FilterLogEvents', 'logs:GetLogEvents', 'route53:Get*', 'route53:List*',
            's3:GetBucket*', 's3:ListAllMyBuckets', 'sqs:GetQueue*', 'sqs:ListQueues', 'ssm:GetParameter',
            'ssm:GetParameters', 'ssm:GetParametersByPath', 'wafv2:Get*']
          Resource: '*'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': diagnostic}
        - Sid: ReadDiagnosticBaselineObjects
          Effect: Allow
          Action: ['s3:GetObject', 's3:GetObjectVersion']
          Resource: [!Sub '${StateBucketArn}/${DeploymentId}/*/terraform.tfstate', !Sub '${EvidenceBucketArn}/evidence/${DeploymentId}/*',
            !Sub '${EvidenceBucketArn}/recovery/${DeploymentId}/*', !Sub '${ContractsBucketArn}/${DeploymentId}/*']
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': diagnostic}
        - Sid: DecryptDiagnosticInputs
          Effect: Allow
          Action: ['kms:Decrypt', 'kms:DescribeKey']
          Resource: [!Sub '${StateKmsKeyArn}', !Sub '${EvidenceKmsKeyArn}', !Sub '${ContractsKmsKeyArn}']
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': diagnostic}
        - Sid: DenyDiagnosticWritesAndRoleChaining
          Effect: Deny
          Action: ['dynamodb:Delete*', 'dynamodb:Put*', 'dynamodb:Update*', 'ec2:Create*', 'ec2:Delete*',
            'ec2:Modify*', 'ecs:Create*', 'ecs:Delete*', 'ecs:RunTask', 'ecs:Update*', 'iam:Attach*',
            'iam:Create*', 'iam:Delete*', 'iam:Detach*', 'iam:Put*', 'iam:Update*', 's3:Delete*', 's3:Put*',
            'sqs:Delete*', 'sqs:PurgeQueue', 'sqs:SendMessage', 'ssm:DeleteParameter', 'ssm:PutParameter',
            'sts:AssumeRole']
          Resource: '*'
  StateRecoveryPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'ScanalyzeCustomer-StateRecovery-${DeploymentId}'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: ListBoundStateVersions
          Effect: Allow
          Action: ['s3:ListBucket', 's3:ListBucketVersions']
          Resource: !Sub '${StateBucketArn}'
          Condition:
            StringEquals: {'aws:PrincipalTag/deployment_id': !Sub '${DeploymentId}', 'aws:PrincipalTag/operation': state-recovery}
            StringLike: {'s3:prefix': !Sub '${DeploymentId}/*/terraform.tfstate'}
        - Sid: ReadBoundStateVersions
          Effect: Allow
          Action: ['s3:GetObject', 's3:GetObjectVersion']
          Resource: !Sub '${StateBucketArn}/${DeploymentId}/*/terraform.tfstate'
          Condition:
            StringEquals: {'aws:PrincipalTag/deployment_id': !Sub '${DeploymentId}', 'aws:PrincipalTag/operation': state-recovery}
        - Sid: RestoreBoundStateVersion
          Effect: Allow
          Action: s3:PutObject
          Resource: !Sub '${StateBucketArn}/${DeploymentId}/*/terraform.tfstate'
          Condition:
            StringEquals: {'aws:PrincipalTag/deployment_id': !Sub '${DeploymentId}', 'aws:PrincipalTag/operation': state-recovery,
              's3:x-amz-server-side-encryption': 'aws:kms', 's3:x-amz-server-side-encryption-aws-kms-key-id': !Sub '${StateKmsKeyArn}'}
        - Sid: DeleteOnlyReviewedNativeLockfile
          Effect: Allow
          Action: s3:DeleteObject
          Resource: !Sub '${StateBucketArn}/${DeploymentId}/*/terraform.tfstate.tflock'
          Condition:
            StringEquals: {'aws:PrincipalTag/deployment_id': !Sub '${DeploymentId}', 'aws:PrincipalTag/operation': state-recovery,
              'aws:PrincipalTag/recovery_approved': 'true'}
        - Sid: UseStateRecoveryKey
          Effect: Allow
          Action: ['kms:Decrypt', 'kms:DescribeKey', 'kms:Encrypt', 'kms:GenerateDataKey']
          Resource: !Sub '${StateKmsKeyArn}'
          Condition:
            StringEquals: {'aws:PrincipalTag/deployment_id': !Sub '${DeploymentId}', 'aws:PrincipalTag/operation': state-recovery}
        - Sid: DenyNonStateAccessAndRoleChaining
          Effect: Deny
          Action: ['dynamodb:*', 'ec2:*', 'ecr:*', 'ecs:*', 'iam:*', 'organizations:*', 'sqs:*', 'ssm:PutParameter',
            'sts:AssumeRole']
          Resource: '*'
  ApplyStateContractPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'ScanalyzeCustomer-ApplyStateContract-${DeploymentId}'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: ListRegionalState
          Effect: Allow
          Action: ['s3:ListBucket', 's3:ListBucketVersions']
          Resource: !Sub '${StateBucketArn}'
          Condition:
            StringEquals:
              aws:PrincipalTag/operation: apply
              aws:PrincipalTag/layer: [network, platform, data-foundation, cicd, services, edge-identity,
                addons]
            StringLike:
              s3:prefix: [!Sub '${DeploymentId}/${AWS::Region}/${!aws:PrincipalTag/layer}/terraform.tfstate',
                !Sub '${DeploymentId}/${AWS::Region}/${!aws:PrincipalTag/layer}/terraform.tfstate.tflock']
        - Sid: ReadWriteRegionalState
          Effect: Allow
          Action: ['s3:GetObject', 's3:GetObjectVersion', 's3:PutObject']
          Resource: !Sub '${StateBucketArn}/${DeploymentId}/${AWS::Region}/${!aws:PrincipalTag/layer}/terraform.tfstate'
          Condition:
            StringEquals:
              aws:PrincipalTag/operation: apply
              aws:PrincipalTag/layer: [network, platform, data-foundation, cicd, services, edge-identity,
                addons]
        - Sid: ManageRegionalLockfile
          Effect: Allow
          Action: ['s3:DeleteObject', 's3:GetObject', 's3:PutObject']
          Resource: !Sub '${StateBucketArn}/${DeploymentId}/${AWS::Region}/${!aws:PrincipalTag/layer}/terraform.tfstate.tflock'
          Condition:
            StringEquals:
              aws:PrincipalTag/operation: apply
              aws:PrincipalTag/layer: [network, platform, data-foundation, cicd, services, edge-identity,
                addons]
        - Sid: ListGlobalState
          Effect: Allow
          Action: ['s3:ListBucket', 's3:ListBucketVersions']
          Resource: !Sub '${StateBucketArn}'
          Condition:
            StringEquals:
              aws:PrincipalTag/operation: apply
              aws:PrincipalTag/layer: [global, edge]
            StringLike:
              s3:prefix: [!Sub '${DeploymentId}/${!aws:PrincipalTag/layer}/terraform.tfstate', !Sub '${DeploymentId}/${!aws:PrincipalTag/layer}/terraform.tfstate.tflock']
        - Sid: ReadWriteGlobalState
          Effect: Allow
          Action: ['s3:GetObject', 's3:GetObjectVersion', 's3:PutObject']
          Resource: !Sub '${StateBucketArn}/${DeploymentId}/${!aws:PrincipalTag/layer}/terraform.tfstate'
          Condition:
            StringEquals:
              aws:PrincipalTag/operation: apply
              aws:PrincipalTag/layer: [global, edge]
        - Sid: ManageGlobalLockfile
          Effect: Allow
          Action: ['s3:DeleteObject', 's3:GetObject', 's3:PutObject']
          Resource: !Sub '${StateBucketArn}/${DeploymentId}/${!aws:PrincipalTag/layer}/terraform.tfstate.tflock'
          Condition:
            StringEquals:
              aws:PrincipalTag/operation: apply
              aws:PrincipalTag/layer: [global, edge]
        - Sid: ReadOwnSavedPlanVersion
          Effect: Allow
          Action: s3:GetObjectVersion
          Resource: !Sub '${PlanBucketArn}/plan-execution/${DeploymentId}/${!aws:PrincipalTag/change_id}/${!aws:PrincipalTag/layer}/plan.tfplan'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': apply}
        - Sid: WriteOwnContractParameters
          Effect: Allow
          Action: ['ssm:AddTagsToResource', 'ssm:ListTagsForResource', 'ssm:PutParameter']
          Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/scanalyze/deployments/${DeploymentId}/contracts/${!aws:PrincipalTag/layer}/*'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': apply}
        - Sid: ReadSavedPlanKey
          Effect: Allow
          Action: kms:Decrypt
          Resource: !Sub '${EvidenceKmsKeyArn}'
          Condition:
            StringEquals:
              aws:PrincipalTag/operation: apply
              aws:PrincipalTag/layer: [global, network, platform, data-foundation, cicd, services, edge-identity,
                edge, addons]
              kms:ViaService: !Sub 's3.${AWS::Region}.${AWS::URLSuffix}'
              kms:EncryptionContext:aws:s3:arn: !Sub '${PlanBucketArn}'
        - Sid: ReadContracts
          Effect: Allow
          Action: ['s3:GetObject', 's3:GetObjectVersion']
          Resource: !Sub '${ContractsBucketArn}/${DeploymentId}/*'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': apply}
        - Sid: WriteOwnContract
          Effect: Allow
          Action: s3:PutObject
          Resource: !Sub '${ContractsBucketArn}/${DeploymentId}/${!aws:PrincipalTag/layer}/*'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': apply}
        - Sid: ReadContractParameters
          Effect: Allow
          Action: ['ssm:GetParameter', 'ssm:GetParameters', 'ssm:GetParametersByPath']
          Resource: [!Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${DeploymentId}/*',
            !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/scanalyze/deployments/${DeploymentId}/contracts/*']
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': apply}
        - Sid: WritePlatformContractParameters
          Effect: Allow
          Action: ['ssm:AddTagsToResource', 'ssm:PutParameter']
          Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${DeploymentId}/layers/platform/outputs/*'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': apply, 'aws:PrincipalTag/layer': platform}
        - Sid: WriteCicdImageParameters
          Effect: Allow
          Action: ['ssm:AddTagsToResource', 'ssm:PutParameter']
          Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${DeploymentId}/cicd/images/*'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': apply, 'aws:PrincipalTag/layer': cicd}
        - Sid: UseApplyBaselineKeys
          Effect: Allow
          Action: ['kms:Decrypt', 'kms:DescribeKey', 'kms:Encrypt', 'kms:GenerateDataKey']
          Resource: [!Sub '${StateKmsKeyArn}', !Sub '${ContractsKmsKeyArn}']
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': apply}
  ApplyFoundationPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'ScanalyzeCustomer-ApplyFoundation-${DeploymentId}'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: ReadTerraformManagedInfrastructure
          Effect: Allow
          Action: ['acm:DescribeCertificate', 'acm:ListTagsForCertificate', 'apigateway:GET', 'cloudfront:Get*',
            'cloudfront:ListTagsForResource', 'cloudwatch:Describe*', 'cloudwatch:GetDashboard', 'cloudwatch:GetMetric*',
            'cloudwatch:ListMetrics', 'cloudwatch:ListTagsForResource', 'codebuild:BatchGetProjects',
            'codebuild:ListProjects', 'codecommit:GetRepository', 'codecommit:ListTagsForResource', 'codepipeline:GetPipeline',
            'codepipeline:GetPipelineState', 'codepipeline:ListTagsForResource', 'dynamodb:Describe*',
            'dynamodb:ListTagsOfResource', 'ec2:Describe*', 'ecr:Describe*', 'ecr:GetLifecyclePolicy',
            'ecr:GetRepositoryPolicy', 'ecr:ListTagsForResource', 'ecs:Describe*', 'ecs:List*', 'elasticloadbalancing:Describe*',
            'iam:Get*', 'iam:List*', 'kms:Describe*', 'kms:GetKeyPolicy', 'kms:GetKeyRotationStatus',
            'kms:List*', 'logs:Describe*', 'logs:ListTagsForResource', 'route53:Get*', 'route53:List*',
            's3:GetBucket*', 's3:ListAllMyBuckets', 's3:ListBucket', 'sns:GetTopicAttributes', 'sns:ListTagsForResource',
            'sqs:GetQueue*', 'sqs:ListQueueTags', 'sqs:ListQueues', 'wafv2:Get*', 'wafv2:List*', 'sts:GetCallerIdentity']
          Resource: '*'
          Condition:
            StringEquals:
              aws:PrincipalTag/deployment_id: !Sub '${DeploymentId}'
              aws:PrincipalTag/operation: apply
              aws:PrincipalTag/layer: [global, network, platform, data-foundation, cicd, services, edge-identity,
                edge, addons]
        - Sid: ManageNetworkLayer
          Effect: Allow
          Action: ['ec2:AllocateAddress', 'ec2:AssociateRouteTable', 'ec2:AttachInternetGateway', 'ec2:AuthorizeSecurityGroupEgress',
            'ec2:AuthorizeSecurityGroupIngress', 'ec2:CreateInternetGateway', 'ec2:CreateNatGateway',
            'ec2:CreateRoute', 'ec2:CreateRouteTable', 'ec2:CreateSecurityGroup', 'ec2:CreateSubnet',
            'ec2:CreateTags', 'ec2:CreateVpc', 'ec2:CreateVpcEndpoint', 'ec2:ModifySubnetAttribute', 'ec2:ModifyVpcAttribute',
            'ec2:ModifyVpcEndpoint', 'ec2:ReplaceRoute', 'ec2:ReplaceRouteTableAssociation', 'ec2:RevokeSecurityGroupEgress',
            'ec2:RevokeSecurityGroupIngress']
          Resource: '*'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': apply, 'aws:PrincipalTag/layer': network}
        - Sid: ManagePlatformLayer
          Effect: Allow
          Action: ['ec2:AuthorizeSecurityGroupEgress', 'ec2:AuthorizeSecurityGroupIngress', 'ec2:CreateSecurityGroup',
            'ec2:CreateTags', 'ec2:RevokeSecurityGroupEgress', 'ec2:RevokeSecurityGroupIngress', 'ecs:CreateCluster',
            'ecs:PutClusterCapacityProviders', 'ecs:TagResource', 'ecs:UpdateCluster', 'elasticloadbalancing:AddTags',
            'elasticloadbalancing:CreateListener', 'elasticloadbalancing:CreateLoadBalancer', 'elasticloadbalancing:ModifyListener',
            'elasticloadbalancing:ModifyLoadBalancerAttributes']
          Resource: '*'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': apply, 'aws:PrincipalTag/layer': platform}
        - Sid: ManageDataFoundationLayer
          Effect: Allow
          Action: ['dynamodb:CreateTable', 'dynamodb:TagResource', 'dynamodb:UntagResource', 'dynamodb:UpdateContinuousBackups',
            'dynamodb:UpdateTable', 'dynamodb:UpdateTimeToLive', 's3:CreateBucket', 's3:PutBucketLifecycleConfiguration', 's3:PutBucketPublicAccessBlock',
            's3:PutBucketTagging', 's3:PutBucketVersioning', 's3:PutEncryptionConfiguration', 'sqs:CreateQueue',
            'sqs:SetQueueAttributes', 'sqs:TagQueue', 'sqs:UntagQueue']
          Resource: '*'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': apply, 'aws:PrincipalTag/layer': data-foundation}
        - Sid: ManageBoundLayerKey
          Effect: Allow
          Action: kms:EnableKeyRotation
          Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
          Condition:
            StringEquals:
              aws:PrincipalTag/operation: apply
              aws:PrincipalTag/layer: [data-foundation, cicd]
              aws:ResourceTag/customer_id: !Sub '${CustomerId}'
              aws:ResourceTag/deployment_id: !Sub '${DeploymentId}'
              aws:ResourceTag/layer: !Sub '${!aws:PrincipalTag/layer}'
        - Sid: TagBoundLayerKey
          Effect: Allow
          Action: kms:TagResource
          Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
          Condition:
            StringEquals:
              aws:PrincipalTag/operation: apply
              aws:PrincipalTag/layer: [data-foundation, cicd]
              aws:ResourceTag/customer_id: !Sub '${CustomerId}'
              aws:ResourceTag/deployment_id: !Sub '${DeploymentId}'
              aws:ResourceTag/layer: !Sub '${!aws:PrincipalTag/layer}'
              aws:RequestTag/customer_id: !Sub '${CustomerId}'
              aws:RequestTag/deployment_id: !Sub '${DeploymentId}'
              aws:RequestTag/layer: !Sub '${!aws:PrincipalTag/layer}'
            ForAllValues:StringEquals:
              aws:TagKeys: [customer_id, deployment_id, layer]
        - Sid: CreateBoundLayerGrant
          Effect: Allow
          Action: kms:CreateGrant
          Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
          Condition:
            StringEquals:
              aws:PrincipalTag/operation: apply
              aws:PrincipalTag/layer: [data-foundation, cicd]
              aws:ResourceTag/customer_id: !Sub '${CustomerId}'
              aws:ResourceTag/deployment_id: !Sub '${DeploymentId}'
              aws:ResourceTag/layer: !Sub '${!aws:PrincipalTag/layer}'
            Bool: {'kms:GrantIsForAWSResource': 'true'}
            ForAllValues:StringEquals:
              kms:GrantOperations: [Decrypt, DescribeKey, Encrypt, GenerateDataKey, GenerateDataKeyWithoutPlaintext]
        - Sid: ManageExactDataFoundationAlias
          Effect: Allow
          Action: ['kms:CreateAlias', 'kms:UpdateAlias']
          Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/${DeploymentId}-data'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': apply, 'aws:PrincipalTag/layer': data-foundation}
  ApplyDeliveryPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'ScanalyzeCustomer-ApplyDelivery-${DeploymentId}'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: ManageCicdLayer
          Effect: Allow
          Action: ['codebuild:CreateProject', 'codebuild:UpdateProject', 'codecommit:CreateRepository',
            'codecommit:TagResource', 'codecommit:UpdateRepositoryDescription', 'codepipeline:CreatePipeline',
            'codepipeline:TagResource', 'codepipeline:UpdatePipeline', 'ecr:CreateRepository', 'ecr:PutLifecyclePolicy',
            'ecr:PutImageScanningConfiguration', 'ecr:PutImageTagMutability', 'ecr:SetRepositoryPolicy',
            'ecr:TagResource', 'logs:CreateLogGroup', 'logs:PutRetentionPolicy', 'logs:TagResource',
            's3:CreateBucket', 's3:PutBucketLifecycleConfiguration', 's3:PutBucketPublicAccessBlock',
            's3:PutBucketTagging', 's3:PutBucketVersioning', 's3:PutEncryptionConfiguration']
          Resource: '*'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': apply, 'aws:PrincipalTag/layer': cicd}
        - Sid: ManageExactCicdAlias
          Effect: Allow
          Action: ['kms:CreateAlias', 'kms:UpdateAlias']
          Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/${DeploymentId}-cicd-artifacts'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': apply, 'aws:PrincipalTag/layer': cicd}
        - Sid: BindLayerAliasToBoundKey
          Effect: Allow
          Action: ['kms:CreateAlias', 'kms:UpdateAlias']
          Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
          Condition:
            StringEquals:
              aws:PrincipalTag/operation: apply
              aws:PrincipalTag/layer: [data-foundation, cicd]
              aws:ResourceTag/customer_id: !Sub '${CustomerId}'
              aws:ResourceTag/deployment_id: !Sub '${DeploymentId}'
              aws:ResourceTag/layer: !Sub '${!aws:PrincipalTag/layer}'
        - Sid: PassCodeBuild
          Effect: Allow
          Action: iam:PassRole
          Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${DeploymentId}-codebuild-role'
          Condition:
            StringEquals:
              aws:PrincipalTag/operation: apply
              aws:PrincipalTag/layer: cicd
              iam:PassedToService: !Sub 'codebuild.${AWS::URLSuffix}'
        - Sid: PassCodePipeline
          Effect: Allow
          Action: iam:PassRole
          Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${DeploymentId}-codepipeline-role'
          Condition:
            StringEquals:
              aws:PrincipalTag/operation: apply
              aws:PrincipalTag/layer: cicd
              iam:PassedToService: !Sub 'codepipeline.${AWS::URLSuffix}'
        - Sid: ManageServicesLayer
          Effect: Allow
          Action: ['ec2:AuthorizeSecurityGroupEgress', 'ec2:AuthorizeSecurityGroupIngress', 'ec2:CreateSecurityGroup',
            'ec2:CreateTags', 'ec2:RevokeSecurityGroupEgress', 'ec2:RevokeSecurityGroupIngress', 'ecs:CreateService',
            'ecs:RegisterTaskDefinition', 'ecs:TagResource', 'ecs:UpdateService', 'elasticloadbalancing:AddTags',
            'elasticloadbalancing:CreateTargetGroup', 'elasticloadbalancing:ModifyTargetGroup', 'elasticloadbalancing:ModifyTargetGroupAttributes']
          Resource: '*'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': apply, 'aws:PrincipalTag/layer': services}
        - Sid: PassEcsExecution
          Effect: Allow
          Action: iam:PassRole
          Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${DeploymentId}-ecs-task-execution'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': apply, 'aws:PrincipalTag/layer': services, 'iam:PassedToService': !Sub 'ecs-tasks.${AWS::URLSuffix}'}
        - Sid: ManageEdgeIdentityLayer
          Effect: Allow
          Action: ['apigateway:DELETE', 'apigateway:PATCH', 'apigateway:POST', 'apigateway:PUT']
          Resource: [!Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis*', !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/vpclinks*',
            !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags/*']
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': apply, 'aws:PrincipalTag/layer': edge-identity}
        - Sid: ManageEdgeLayer
          Effect: Allow
          Action: ['acm:AddTagsToCertificate', 'acm:RequestCertificate', 'cloudfront:CreateCachePolicy',
            'cloudfront:CreateDistribution', 'cloudfront:CreateFunction', 'cloudfront:CreateOriginAccessControl',
            'cloudfront:CreateResponseHeadersPolicy', 'cloudfront:PublishFunction', 'cloudfront:TagResource',
            'cloudfront:UpdateCachePolicy', 'cloudfront:UpdateDistribution', 'cloudfront:UpdateFunction',
            'cloudfront:UpdateOriginAccessControl', 'cloudfront:UpdateResponseHeadersPolicy', 'route53:ChangeResourceRecordSets',
            'wafv2:CreateWebACL', 'wafv2:TagResource', 'wafv2:UpdateWebACL']
          Resource: '*'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': apply, 'aws:PrincipalTag/layer': edge}
        - Sid: ManageExactFrontendRuntimeConfig
          Effect: Allow
          Action: ['s3:GetObject', 's3:PutObject']
          Resource: !Sub 'arn:${AWS::Partition}:s3:::scanalyze-${AWS::AccountId}-frontend/${DeploymentId}/config.json'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': apply, 'aws:PrincipalTag/layer': edge}
        - Sid: ManageAddonsLayer
          Effect: Allow
          Action: ['cloudwatch:PutDashboard', 'cloudwatch:PutMetricAlarm', 'cloudwatch:TagResource', 'logs:CreateLogGroup',
            'logs:PutRetentionPolicy', 'logs:TagResource', 'sns:CreateTopic', 'sns:SetTopicAttributes',
            'sns:TagResource']
          Resource: '*'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': apply, 'aws:PrincipalTag/layer': addons}
        - Sid: DenyTerminalMutation
          Effect: Deny
          Action: ['iam:AttachRolePolicy', 'iam:DeleteRole', 'iam:DeleteRolePermissionsBoundary', 'iam:DeleteRolePolicy',
            'iam:DetachRolePolicy', 'iam:PutRolePermissionsBoundary', 'iam:PutRolePolicy', 'iam:TagRole',
            'iam:UntagRole', 'iam:UpdateAssumeRolePolicy']
          Resource: [!Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ScanalyzeCustomer-Plan',
            !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ScanalyzeCustomer-Apply', !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ScanalyzeCustomer-Identity-Plan',
            !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ScanalyzeCustomer-Identity-Apply',
            !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ScanalyzeCustomer-Promotion', !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ScanalyzeCustomer-Validation',
            !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ScanalyzeCustomer-Diagnostic', !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ScanalyzeCustomer-StateRecovery']
        - Sid: DenyEscalation
          Effect: Deny
          Action: ['account:*', 'aws-portal:*', 'billing:*', 'budgets:*', 'ce:*', 'cur:*', 'iam:CreateAccessKey',
            'iam:CreateUser', 'iam:DeleteUser', 'iam:UpdateLoginProfile', 'organizations:*', 'sts:AssumeRole']
          Resource: '*'
  IdentityApplyCorePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'ScanalyzeCustomer-IdentityApplyCore-${DeploymentId}'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: ListIdentityState
          Effect: Allow
          Action: ['s3:ListBucket', 's3:ListBucketVersions']
          Resource: !Sub '${StateBucketArn}'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': apply, 'aws:PrincipalTag/layer': identity-control-plane}
            StringLike:
              s3:prefix: [!Sub '${DeploymentId}/${AWS::Region}/identity-control-plane/terraform.tfstate',
                !Sub '${DeploymentId}/${AWS::Region}/identity-control-plane/terraform.tfstate.tflock']
        - Sid: ReadWriteIdentityLayerState
          Effect: Allow
          Action: ['s3:GetObject', 's3:GetObjectVersion', 's3:PutObject']
          Resource: !Sub '${StateBucketArn}/${DeploymentId}/${AWS::Region}/identity-control-plane/terraform.tfstate'
        - Sid: ManageIdentityLayerLock
          Effect: Allow
          Action: ['s3:GetObject', 's3:PutObject', 's3:DeleteObject']
          Resource: !Sub '${StateBucketArn}/${DeploymentId}/${AWS::Region}/identity-control-plane/terraform.tfstate.tflock'
        - Sid: ReadIdentityPlanExecutionZone
          Effect: Allow
          Action: ['s3:GetObjectVersion']
          Resource: !Sub '${PlanBucketArn}/plan-execution/${DeploymentId}/${!aws:PrincipalTag/change_id}/identity-control-plane/plan.tfplan'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': apply, 'aws:PrincipalTag/layer': identity-control-plane}
        - Sid: ReadApprovedArtifacts
          Effect: Allow
          Action: ['s3:GetObject']
          Resource: !Sub 'arn:${AWS::Partition}:s3:::scanalyze-shared-releases/*'
        - Sid: PublishIdentityContract
          Effect: Allow
          Action: ['s3:GetObject', 's3:PutObject', 'ssm:AddTagsToResource', 'ssm:GetParameter', 'ssm:GetParameters', 'ssm:ListTagsForResource', 'ssm:PutParameter']
          Resource: [!Sub '${ContractsBucketArn}/${DeploymentId}/identity-control-plane/*', !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/scanalyze/deployments/${DeploymentId}/contracts/identity-control-plane/*']
        - Sid: ReadPreprovisionedIdentityRuntimeRoles
          Effect: Allow
          Action: ['iam:GetRole', 'iam:GetRolePolicy']
          Resource: [!Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/scanalyze/${DeploymentId}/identity-${DeploymentId}-pre-token',
            !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/scanalyze/${DeploymentId}/identity-${DeploymentId}-control-processor']
          Condition:
            StringEquals: {'aws:ResourceTag/customer_id': !Sub '${CustomerId}', 'aws:ResourceTag/deployment_id': !Sub '${DeploymentId}',
              'aws:ResourceTag/layer': identity-control-plane}
        - Sid: PassPreTokenRoleToFunction
          Effect: Allow
          Action: iam:PassRole
          Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/scanalyze/${DeploymentId}/identity-${DeploymentId}-pre-token'
          Condition:
            StringEquals: {'iam:PassedToService': !Sub 'lambda.${AWS::URLSuffix}'}
            ArnLike: {'iam:AssociatedResourceArn': !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${DeploymentId}-identity-pre-token'}
        - Sid: PassControlProcessorRoleToFunction
          Effect: Allow
          Action: iam:PassRole
          Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/scanalyze/${DeploymentId}/identity-${DeploymentId}-control-processor'
          Condition:
            StringEquals: {'iam:PassedToService': !Sub 'lambda.${AWS::URLSuffix}'}
            ArnLike: {'iam:AssociatedResourceArn': !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${DeploymentId}-identity-control-processor'}
        - Sid: DescribeIdentityMonitoring
          Effect: Allow
          Action: ['cloudwatch:DescribeAlarms', 'logs:DescribeLogGroups', 'sts:GetCallerIdentity']
          Resource: '*'
          Condition:
            StringEquals: {'aws:PrincipalTag/operation': apply, 'aws:PrincipalTag/layer': identity-control-plane}
        - Sid: ReadPreprovisionedIdentityUserPool
          Effect: Allow
          Action: ['cognito-idp:DescribeUserPool', 'cognito-idp:GetGroup', 'cognito-idp:ListGroups']
          Resource: !Sub 'arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'
          Condition:
            StringEquals: {'aws:ResourceTag/customer_id': !Sub '${CustomerId}', 'aws:ResourceTag/deployment_id': !Sub '${DeploymentId}',
              'aws:ResourceTag/layer': identity-control-plane}
        - Sid: UseDeploymentInfrastructureEncryptionKeys
          Effect: Allow
          Action: ['kms:Decrypt', 'kms:DescribeKey', 'kms:Encrypt', 'kms:GenerateDataKey']
          Resource: [!Sub '${StateKmsKeyArn}', !Sub '${ContractsKmsKeyArn}']
        - Sid: ReadSavedPlanKey
          Effect: Allow
          Action: kms:Decrypt
          Resource: !Sub '${EvidenceKmsKeyArn}'
          Condition:
            StringEquals:
              aws:PrincipalTag/operation: apply
              aws:PrincipalTag/layer: identity-control-plane
              kms:ViaService: !Sub 's3.${AWS::Region}.${AWS::URLSuffix}'
              kms:EncryptionContext:aws:s3:arn: !Sub '${PlanBucketArn}'
  IdentityApplyResourcesPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'ScanalyzeCustomer-IdentityApplyResources-${DeploymentId}'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: ManageIdentityFunctions
          Effect: Allow
          Action: ['lambda:CreateAlias', 'lambda:CreateFunction', 'lambda:GetAlias',
            'lambda:GetFunction', 'lambda:GetPolicy', 'lambda:ListVersionsByFunction', 'lambda:PublishVersion',
            'lambda:TagResource', 'lambda:UntagResource', 'lambda:UpdateAlias', 'lambda:UpdateFunctionCode',
            'lambda:UpdateFunctionConfiguration']
          Resource: [!Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${DeploymentId}-identity-pre-token',
            !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${DeploymentId}-identity-pre-token:*',
            !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${DeploymentId}-identity-control-processor',
            !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${DeploymentId}-identity-control-processor:*']
        - Sid: ManageIdentityStores
          Effect: Allow
          Action: ['dynamodb:CreateTable', 'dynamodb:DescribeContinuousBackups', 'dynamodb:DescribeTable',
