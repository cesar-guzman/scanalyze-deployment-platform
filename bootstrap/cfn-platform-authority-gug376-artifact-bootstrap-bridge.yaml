  ManagementRecoveryRole:
    Type: AWS::IAM::Role
    Condition: CreateCleanupAssignments
    Properties:
      RoleName: ScanalyzeGug376RouteBrokerRecovery
      Path: /scanalyze/platform-authority/
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Sid: TrustOnlyCreateDispatchRecovery, Effect: Allow, Principal: {AWS: !Sub 'arn:${AWS::Partition}:iam::${AuthorityAccountId}:root'}, Action: [sts:AssumeRole, sts:SetSourceIdentity], Condition: {ArnEquals: {aws:PrincipalArn: !Sub 'arn:${AWS::Partition}:iam::${AuthorityAccountId}:role/ScanalyzeGug376RouteCreateDispatchRecovery'}, StringEquals: {sts:SourceIdentity: !Sub 'gug376-create-recovery-${SourceCommit}'}, DateGreaterThanEquals: {aws:CurrentTime: !Ref AccessNotBefore}, DateLessThan: {aws:CurrentTime: !Ref CleanupNotAfter}}}
          - {Sid: TrustOnlyExecuteDispatchRecovery, Effect: Allow, Principal: {AWS: !Sub 'arn:${AWS::Partition}:iam::${AuthorityAccountId}:root'}, Action: [sts:AssumeRole, sts:SetSourceIdentity], Condition: {ArnEquals: {aws:PrincipalArn: !Sub 'arn:${AWS::Partition}:iam::${AuthorityAccountId}:role/ScanalyzeGug376RouteExecuteDispatchRecovery'}, StringEquals: {sts:SourceIdentity: !Sub 'gug376-execute-recovery-${SourceCommit}'}, DateGreaterThanEquals: {aws:CurrentTime: !Ref AccessNotBefore}, DateLessThan: {aws:CurrentTime: !Ref CleanupNotAfter}}}
      Policies:
        - PolicyName: ExactRouteBrokerCausalRecoveryReadback
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Sid: ConfirmOnlyCurrentCaller, Effect: Allow, Action: 'sts:GetCallerIdentity', Resource: '*'}
              - {Sid: ReadOnlyExactDispatchAudit, Effect: Allow, Action: 'cloudtrail:LookupEvents', Resource: '*', Condition: {StringEquals: {aws:RequestedRegion: us-east-1}, DateGreaterThanEquals: {aws:CurrentTime: !Ref AccessNotBefore}, DateLessThan: {aws:CurrentTime: !Ref CleanupNotAfter}}}
              - Sid: ReadOnlyExactManagementStacks
                Effect: Allow
                Action: [cloudformation:DescribeChangeSet, cloudformation:DescribeStacks, cloudformation:GetTemplate, cloudformation:ListStackResources]
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:us-east-1:${ManagementAccountId}:stack/scanalyze-platform-authority-gug376-temporary-change-set-route/*
                  - !Sub arn:${AWS::Partition}:cloudformation:us-east-1:${ManagementAccountId}:stack/scanalyze-platform-authority-bootstrap-plan-repair-delegation/*
                  - !Sub arn:${AWS::Partition}:cloudformation:us-east-1:${ManagementAccountId}:changeSet/gug376-temporary-route-create/*
                  - !Sub arn:${AWS::Partition}:cloudformation:us-east-1:${ManagementAccountId}:changeSet/gug376-temporary-route-create-recovery-1/*
                  - !Sub arn:${AWS::Partition}:cloudformation:us-east-1:${ManagementAccountId}:changeSet/gug376-temporary-route-seed-revoke/*
                  - !Sub arn:${AWS::Partition}:cloudformation:us-east-1:${ManagementAccountId}:changeSet/gug376-temporary-route-invoker-revoke/*
                  - !Sub arn:${AWS::Partition}:cloudformation:us-east-1:${ManagementAccountId}:changeSet/gug376-plan-repair-delegation-create/*
                  - !Sub arn:${AWS::Partition}:cloudformation:us-east-1:${ManagementAccountId}:changeSet/gug376-plan-repair-delegation-revoke/*
                Condition: {StringEquals: {aws:RequestedRegion: us-east-1}, DateGreaterThanEquals: {aws:CurrentTime: !Ref AccessNotBefore}, DateLessThan: {aws:CurrentTime: !Ref CleanupNotAfter}}
              - Sid: ReadOnlyExactIdentityCenterState
                Effect: Allow
                Action: [sso:DescribePermissionSet, sso:DescribePermissionSetProvisioningStatus, sso:GetInlinePolicyForPermissionSet, sso:GetPermissionsBoundaryForPermissionSet, sso:ListAccountAssignments, sso:ListAccountsForProvisionedPermissionSet, sso:ListCustomerManagedPolicyReferencesInPermissionSet, sso:ListManagedPoliciesInPermissionSet, sso:ListPermissionSetProvisioningStatus, sso:ListTagsForResource]
                Resource:
                  - !Ref IdentityCenterInstanceArn
                  - !Sub
                    - arn:${AWS::Partition}:sso:::permissionSet/${InstanceId}/ps-*
                    - InstanceId: !Select [1, !Split ['/', !Ref IdentityCenterInstanceArn]]
                  - !Sub arn:${AWS::Partition}:sso:::account/${AuthorityAccountId}
                Condition: {StringEquals: {aws:RequestedRegion: us-east-1}, DateGreaterThanEquals: {aws:CurrentTime: !Ref AccessNotBefore}, DateLessThan: {aws:CurrentTime: !Ref CleanupNotAfter}}
              - Sid: DenyEveryRecoveryMutation
                Effect: Deny
                Action: [cloudformation:CreateChangeSet, cloudformation:DeleteStack, cloudformation:ExecuteChangeSet, dynamodb:DeleteResourcePolicy, dynamodb:DeleteTable, dynamodb:UpdateTable, iam:DeleteRole, iam:DeleteRolePolicy, iam:DetachRolePolicy, kms:CancelKeyDeletion, kms:DeleteAlias, kms:ScheduleKeyDeletion, lambda:DeleteAlias, lambda:DeleteCodeSigningConfig, lambda:DeleteFunction, lambda:DeleteFunctionEventInvokeConfig, lambda:DeleteRuntimeManagementConfig, logs:DeleteLogGroup, sso:DeleteAccountAssignment, sso:DeleteInlinePolicyFromPermissionSet, sso:DeletePermissionSet, sso:ProvisionPermissionSet]
                Resource: '*'
              - {Sid: DenyOutsideHomeRegion, Effect: Deny, NotAction: 'sts:GetCallerIdentity', Resource: '*', Condition: {StringNotEquals: {aws:RequestedRegion: us-east-1}}}
              - {Sid: DenyBeforeAbsoluteStart, Effect: Deny, Action: '*', Resource: '*', Condition: {DateLessThan: {aws:CurrentTime: !Ref AccessNotBefore}}}
              - {Sid: DenyAllAtCleanupExpiry, Effect: Deny, Action: '*', Resource: '*', Condition: {DateGreaterThanEquals: {aws:CurrentTime: !Ref CleanupNotAfter}}}
      Tags: [{Key: managed_by, Value: cloudformation}, {Key: work_package, Value: GUG-376}, {Key: source_commit, Value: !Ref SourceCommit}]

  RouteSeedCleanupAssignment:
    Type: AWS::SSO::Assignment
    Condition: CreateCleanupAssignments
    Properties: {InstanceArn: !Ref IdentityCenterInstanceArn, PermissionSetArn: !GetAtt RouteSeedCleanupPermissionSet.PermissionSetArn, PrincipalId: !Ref BootstrapPrincipalId, PrincipalType: USER, TargetId: !Ref ManagementAccountId, TargetType: AWS_ACCOUNT}

  BrokerSeedCleanupAssignment:
    Type: AWS::SSO::Assignment
    Condition: CreateCleanupAssignments
    Properties: {InstanceArn: !Ref IdentityCenterInstanceArn, PermissionSetArn: !GetAtt BrokerSeedCleanupPermissionSet.PermissionSetArn, PrincipalId: !Ref BootstrapPrincipalId, PrincipalType: USER, TargetId: !Ref AuthorityAccountId, TargetType: AWS_ACCOUNT}

  ArtifactBootstrapAssignment:
    Type: AWS::SSO::Assignment
    Condition: CreateAssignment
    Properties: {InstanceArn: !Ref IdentityCenterInstanceArn, PermissionSetArn: !GetAtt ArtifactBootstrapPermissionSet.PermissionSetArn, PrincipalId: !Ref BootstrapPrincipalId, PrincipalType: USER, TargetId: !Ref AuthorityAccountId, TargetType: AWS_ACCOUNT}

Outputs:
  ArtifactBootstrapPermissionSetArn:
    Value: !GetAtt ArtifactBootstrapPermissionSet.PermissionSetArn
  AssignmentMode:
    Value: !Ref AssignmentEnabled
  CleanupAssignmentMode:
    Value: !Ref CleanupAssignmentsEnabled
  CleanupNotAfter:
    Value: !Ref CleanupNotAfter
  ManagementRecoveryRoleArn:
    Condition: CreateCleanupAssignments
    Value: !GetAtt ManagementRecoveryRole.Arn
  ManagementRecoveryRoleName:
    Condition: CreateCleanupAssignments
    Value: !Ref ManagementRecoveryRole
  RouteSeedCleanupPermissionSetArn:
    Condition: CreateCleanupAssignments
    Value: !GetAtt RouteSeedCleanupPermissionSet.PermissionSetArn
  BrokerSeedCleanupPermissionSetArn:
    Condition: CreateCleanupAssignments
    Value: !GetAtt BrokerSeedCleanupPermissionSet.PermissionSetArn
  RouteSeedCleanupProfileName:
    Condition: CreateCleanupAssignments
    Value: !Sub ${ManagementAccountId}_ScanalyzeGug376RouteSeedCleanup
  BrokerSeedCleanupProfileName:
    Condition: CreateCleanupAssignments
    Value: !Sub ${AuthorityAccountId}_ScanalyzeGug376BrokerSeedCleanup
  AuthorityProfileName:
    Value: !Sub ${AuthorityAccountId}_ScanalyzeGug376ArtifactBootstrap
  ProductionAuthorized:
    Value: 'false'
