AWSTemplateFormatVersion: '2010-09-09'
Description: IMPORT-only adoption of the four retained GUG-274 checksum buckets and policies; no custody repair or trail creation.
Metadata:
  RecoveryPhase: IMPORT_ONLY
  SourceCommit: '6954e63a81657c6fb52aeedba12656836e67d897'
  ObservedOriginalTemplateSha256: '59de32582c35fa1a283a8d3de7da7eff14fb286658b081abbc91be1e223db6f8'
  ImportScope: Four retained resources at their original configuration. This template neither proves their current state nor authorizes import execution.
  ImportEligibility: Unresolved. Verify live existence and that each resource is outside every other stack in us-east-1 before import; DELETE_SKIPPED alone is not proof.
  Provenance: TemplateDigest preserves the original deployed template_sha256 tags. Calculate and review this import file's own SHA-256 separately; it must not replace the original binding.
  StackTagGate: Import can apply stack-level tags. Review those writes separately and compare retained configuration before and after import.
  CustodyLimit: The original audit policy rejected during trail creation is intentionally preserved. The exact internal rejection cause is unverified. Repair only through a separate reviewed UPDATE after IMPORT_COMPLETE.
  References:
    - https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/import-resources-manually.html
    - https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/resource-import-supported-resources.html
Parameters:
  ReportBucketName:
    Type: String
    Default: scanalyze-gug274-checksum-reports-042360977644-us-east-1
    AllowedValues: [scanalyze-gug274-checksum-reports-042360977644-us-east-1]
  AuditBucketName:
    Type: String
    Default: scanalyze-gug274-checksum-audit-042360977644-us-east-1
    AllowedValues: [scanalyze-gug274-checksum-audit-042360977644-us-east-1]
  TrailName:
    Type: String
    Default: scanalyze-gug274-checksum-custody
    AllowedValues: [scanalyze-gug274-checksum-custody]
    Description: Original fixed trail name used only in retained policy SourceArn conditions; this stage contains no trail resource.
  TemplateDigest:
    Type: String
    Default: '59de32582c35fa1a283a8d3de7da7eff14fb286658b081abbc91be1e223db6f8'
    AllowedValues: ['59de32582c35fa1a283a8d3de7da7eff14fb286658b081abbc91be1e223db6f8']
    AllowedPattern: '^[a-f0-9]{64}$'
    Description: Original deployed custody template SHA-256 retained in existing tags, not the SHA-256 of this import template.
  ApprovedManifestWriterRoleArn:
    Type: String
    Default: arn:aws:iam::042360977644:role/scanalyze/platform-authority/ScanalyzeGug274ChecksumManifestWriter
    AllowedValues: [arn:aws:iam::042360977644:role/scanalyze/platform-authority/ScanalyzeGug274ChecksumManifestWriter]
    AllowedPattern: '^arn:aws:iam::042360977644:role/([A-Za-z0-9_+=,.@-]+/)*[A-Za-z0-9_+=,.@-]{1,64}$'
    MaxLength: 600
    Description: Original exact Deny-condition binding; import does not assume this role or create an identity grant.
  ApprovedBatchWriterRoleArn:
    Type: String
    Default: arn:aws:iam::042360977644:role/scanalyze/platform-authority/ScanalyzeGug274ChecksumBatchWriter
    AllowedValues: [arn:aws:iam::042360977644:role/scanalyze/platform-authority/ScanalyzeGug274ChecksumBatchWriter]
    AllowedPattern: '^arn:aws:iam::042360977644:role/([A-Za-z0-9_+=,.@-]+/)*[A-Za-z0-9_+=,.@-]{1,64}$'
    MaxLength: 600
    Description: Original exact Deny-only binding to the proposed, previously absent Batch writer. Import creates no role or Allow grant and does not assume it.
Rules:
  ExactInstallationScope:
    Assertions:
      - Assert: !Equals [!Ref AWS::AccountId, '042360977644']
        AssertDescription: Install only in the platform authority account.
      - Assert: !Equals [!Ref AWS::Region, us-east-1]
        AssertDescription: Install only in us-east-1.
  SeparateManifestAndReportWriters:
    Assertions:
      - Assert: !Not [!Equals [!Ref ApprovedManifestWriterRoleArn, !Ref ApprovedBatchWriterRoleArn]]
        AssertDescription: Separate the manifest writer and Batch report writer roles; their trust policies still require independent review.
Resources:
  ReportBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref ReportBucketName
      VersioningConfiguration: {Status: Enabled}
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      Tags:
        - {Key: service, Value: scanalyze-platform-authority}
        - {Key: work_package, Value: GUG-274}
        - {Key: purpose, Value: checksum-reports}
        - {Key: template_sha256, Value: !Ref TemplateDigest}
  AuditBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref AuditBucketName
      VersioningConfiguration: {Status: Enabled}
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      Tags:
        - {Key: service, Value: scanalyze-platform-authority}
        - {Key: work_package, Value: GUG-274}
        - {Key: purpose, Value: checksum-audit}
        - {Key: template_sha256, Value: !Ref TemplateDigest}
  ReportBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref ReportBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt ReportBucket.Arn, !Sub '${ReportBucket.Arn}/*']
            # Network context can be redacted in direct AWS service calls.
            # Separate writer/service/source denies still constrain writes.
            Condition:
              Bool:
                aws:SecureTransport: 'false'
                aws:PrincipalIsAWSService: 'false'
          - Sid: DenyWritesOutsideChecksumPrefixes
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            NotResource:
              - !Sub '${ReportBucket.Arn}/scanalyze/platform-authority/gug-274/checksum/manifests/*'
              - !Sub '${ReportBucket.Arn}/scanalyze/platform-authority/gug-274/checksum/reports/*'
          - Sid: DenyManifestWritesByOtherPrincipals
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${ReportBucket.Arn}/scanalyze/platform-authority/gug-274/checksum/manifests/*'
            Condition:
              ArnNotEquals: {aws:PrincipalArn: !Ref ApprovedManifestWriterRoleArn}
          - Sid: DenyReportWritesByOtherPrincipals
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${ReportBucket.Arn}/scanalyze/platform-authority/gug-274/checksum/reports/*'
            Condition:
              ArnNotEquals: {aws:PrincipalArn: !Ref ApprovedBatchWriterRoleArn}
          - Sid: DenyDeletingChecksumEvidence
            Effect: Deny
            Principal: '*'
            Action: [s3:DeleteObject, s3:DeleteObjectVersion]
            Resource: !Sub '${ReportBucket.Arn}/*'
          - Sid: DenyExplicitWrongEncryption
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${ReportBucket.Arn}/*'
            Condition:
              'Null': {s3:x-amz-server-side-encryption: 'false'}
              StringNotEquals: {s3:x-amz-server-side-encryption: AES256}
          - Sid: DenyCustomerProvidedEncryptionKeys
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${ReportBucket.Arn}/*'
            Condition:
              'Null': {s3:x-amz-server-side-encryption-customer-algorithm: 'false'}
  AuditBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref AuditBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt AuditBucket.Arn, !Sub '${AuditBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
                aws:PrincipalIsAWSService: 'false'
          - Sid: DenyWritesOutsideExactTrailPaths
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            NotResource:
              - !Sub '${AuditBucket.Arn}/scanalyze/platform-authority/gug-274/checksum/audit/AWSLogs/042360977644/CloudTrail/us-east-1/*'
              - !Sub '${AuditBucket.Arn}/scanalyze/platform-authority/gug-274/checksum/audit/AWSLogs/042360977644/CloudTrail-Digest/us-east-1/*'
          # Separate Deny statements implement OR: either wrong service OR wrong
          # trail is rejected, including missing service/source request context.
          - Sid: DenyAuditWritesByOtherServicesOrPrincipals
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${AuditBucket.Arn}/*'
            Condition:
              StringNotEqualsIfExists: {aws:PrincipalServiceName: cloudtrail.amazonaws.com}
          - Sid: DenyAuditWritesFromOtherTrails
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${AuditBucket.Arn}/*'
            Condition:
              ArnNotEqualsIfExists:
                aws:SourceArn: !Sub 'arn:aws:cloudtrail:us-east-1:042360977644:trail/${TrailName}'
          - Sid: DenyDeletingAuditEvidence
            Effect: Deny
            Principal: '*'
            Action: [s3:DeleteObject, s3:DeleteObjectVersion]
            Resource: !Sub '${AuditBucket.Arn}/*'
          - Sid: DenyExplicitWrongEncryption
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${AuditBucket.Arn}/*'
            Condition:
              'Null': {s3:x-amz-server-side-encryption: 'false'}
              StringNotEquals: {s3:x-amz-server-side-encryption: AES256}
          - Sid: DenyCustomerProvidedEncryptionKeys
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${AuditBucket.Arn}/*'
            Condition:
              'Null': {s3:x-amz-server-side-encryption-customer-algorithm: 'false'}
          - Sid: ExactTrailAclCheck
            Effect: Allow
            Principal: {Service: cloudtrail.amazonaws.com}
            Action: s3:GetBucketAcl
            Resource: !GetAtt AuditBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub 'arn:aws:cloudtrail:us-east-1:042360977644:trail/${TrailName}'
          - Sid: ExactTrailLogAndDigestDelivery
            Effect: Allow
            Principal: {Service: cloudtrail.amazonaws.com}
            Action: s3:PutObject
            Resource:
              - !Sub '${AuditBucket.Arn}/scanalyze/platform-authority/gug-274/checksum/audit/AWSLogs/042360977644/CloudTrail/us-east-1/*'
              - !Sub '${AuditBucket.Arn}/scanalyze/platform-authority/gug-274/checksum/audit/AWSLogs/042360977644/CloudTrail-Digest/us-east-1/*'
            Condition:
              StringEquals:
                aws:SourceArn: !Sub 'arn:aws:cloudtrail:us-east-1:042360977644:trail/${TrailName}'
                s3:x-amz-acl: bucket-owner-full-control
