      RoleName: ScanalyzeGug376RouteCreateDispatchRecovery
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ExactCreateDispatchRecoveryReadback
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DenyWrongRegion
                Effect: Deny
                Action: '*'
                Resource: '*'
                Condition:
                  StringNotEquals:
                    aws:RequestedRegion: us-east-1
              - Sid: DenyBeforeRoute
                Effect: Deny
                Action: '*'
                Resource: '*'
                Condition:
                  DateLessThan:
                    aws:CurrentTime: '@@ROUTE_NOT_BEFORE@@'
              - Sid: DenyAfterRecovery
                Effect: Deny
                Action: '*'
                Resource: '*'
                Condition:
                  DateGreaterThanEquals:
                    aws:CurrentTime: '@@RECOVERY_NOT_AFTER@@'
              - Sid: WriteExactRecoveryLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:us-east-1:042360977644:log-group:/aws/lambda/scanalyze-platform-authority-gug376-route-create-dispatch-recovery:*
              - Sid: WriteXrayTelemetry
                Effect: Allow
                Action:
                  - xray:PutTelemetryRecords
                  - xray:PutTraceSegments
                Resource: '*'
              - Sid: ReadAndCasExactBrokerLedger
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !Sub arn:${AWS::Partition}:dynamodb:us-east-1:042360977644:table/scanalyze-platform-authority-gug376-route-broker-ledger
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys: [gug376-route-broker]
                  'Null':
                    dynamodb:LeadingKeys: 'false'
              - Sid: ReadExactBrokerLedgerControlPlane
                Effect: Allow
                Action: dynamodb:DescribeTable
