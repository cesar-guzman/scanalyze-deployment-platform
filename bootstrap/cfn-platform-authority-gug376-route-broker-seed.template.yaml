AWSTemplateFormatVersion: '2010-09-09'
Description: Privately materialized parameterless GUG-376 route broker.

Rules:
  ExactAuthorityAccountAndRegion:
    Assertions:
      - Assert: !Equals [!Ref AWS::AccountId, '042360977644']
      - Assert: !Equals [!Ref AWS::Region, us-east-1]

Resources:
  BrokerLedgerKey:
    Type: AWS::KMS::Key
    DeletionPolicy: @@BROKER_DELETION_POLICY@@
    UpdateReplacePolicy: @@BROKER_UPDATE_REPLACE_POLICY@@
    Properties:
      Description: GUG-376 route broker CAS ledger
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: DelegateOnlyToExactAuthorityAccount
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::042360977644:root
            Action: kms:*
            Resource: '*'
      Tags:
        - Key: managed_by
          Value: cloudformation
        - Key: service
          Value: scanalyze-platform-authority
        - Key: work_package
          Value: GUG-376
        - Key: component
          Value: gug376-route-broker
        - Key: environment
          Value: non-production
        - Key: production
          Value: 'false'
        - Key: source_commit
          Value: '@@SOURCE_COMMIT@@'

  BrokerLedgerKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/scanalyze/platform-authority/gug376-route-broker-ledger
      TargetKeyId: !Ref BrokerLedgerKey

  BrokerLedger:
    Type: AWS::DynamoDB::Table
    DependsOn:
      - CreatorRole
      - ExecutorRole
      - CreateDispatchRecoveryRole
      - ExecuteDispatchRecoveryRole
    DeletionPolicy: @@BROKER_DELETION_POLICY@@
    UpdateReplacePolicy: @@BROKER_UPDATE_REPLACE_POLICY@@
    Properties:
      TableName: scanalyze-platform-authority-gug376-route-broker-ledger
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ledger_id
          AttributeType: S
      KeySchema:
        - AttributeName: ledger_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
        RecoveryPeriodInDays: 35
      DeletionProtectionEnabled: @@BROKER_LEDGER_PROTECTION_BOOLEAN@@
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt BrokerLedgerKey.Arn
      ResourcePolicy:
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: DenyMutationsOutsideExactBrokerWriters
              Effect: Deny
              Principal:
                AWS: '*'
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !Sub arn:${AWS::Partition}:dynamodb:us-east-1:042360977644:table/scanalyze-platform-authority-gug376-route-broker-ledger
              Condition:
                ArnNotEquals:
                  aws:PrincipalArn:
                    - !Sub arn:${AWS::Partition}:iam::042360977644:role/ScanalyzeGug376RouteBrokerCreator
                    - !Sub arn:${AWS::Partition}:iam::042360977644:role/ScanalyzeGug376RouteBrokerExecutor
                    - !Sub arn:${AWS::Partition}:iam::042360977644:role/ScanalyzeGug376RouteCreateDispatchRecovery
                    - !Sub arn:${AWS::Partition}:iam::042360977644:role/ScanalyzeGug376RouteExecuteDispatchRecovery
            - Sid: DenyUnsupportedBrokerLedgerMutationApis
              Effect: Deny
              Principal:
                AWS: '*'
              Action:
                - dynamodb:BatchWriteItem
                - dynamodb:DeleteItem
                - dynamodb:PartiQLDelete
                - dynamodb:PartiQLInsert
                - dynamodb:PartiQLUpdate
              Resource: !Sub arn:${AWS::Partition}:dynamodb:us-east-1:042360977644:table/scanalyze-platform-authority-gug376-route-broker-ledger
            - Sid: DenyExactBrokerWritersOutsideLedgerKey
              Effect: Deny
              Principal:
                AWS: '*'
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !Sub arn:${AWS::Partition}:dynamodb:us-east-1:042360977644:table/scanalyze-platform-authority-gug376-route-broker-ledger
              Condition:
                ArnEquals:
                  aws:PrincipalArn:
                    - !Sub arn:${AWS::Partition}:iam::042360977644:role/ScanalyzeGug376RouteBrokerCreator
                    - !Sub arn:${AWS::Partition}:iam::042360977644:role/ScanalyzeGug376RouteBrokerExecutor
                    - !Sub arn:${AWS::Partition}:iam::042360977644:role/ScanalyzeGug376RouteCreateDispatchRecovery
                    - !Sub arn:${AWS::Partition}:iam::042360977644:role/ScanalyzeGug376RouteExecuteDispatchRecovery
                ForAllValues:StringNotEquals:
                  dynamodb:LeadingKeys: [gug376-route-broker]
                'Null':
                  dynamodb:LeadingKeys: 'false'
            - Sid: DenyExactBrokerWritersWithoutLedgerKey
              Effect: Deny
              Principal:
                AWS: '*'
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !Sub arn:${AWS::Partition}:dynamodb:us-east-1:042360977644:table/scanalyze-platform-authority-gug376-route-broker-ledger
              Condition:
                ArnEquals:
                  aws:PrincipalArn:
                    - !Sub arn:${AWS::Partition}:iam::042360977644:role/ScanalyzeGug376RouteBrokerCreator
                    - !Sub arn:${AWS::Partition}:iam::042360977644:role/ScanalyzeGug376RouteBrokerExecutor
                    - !Sub arn:${AWS::Partition}:iam::042360977644:role/ScanalyzeGug376RouteCreateDispatchRecovery
                    - !Sub arn:${AWS::Partition}:iam::042360977644:role/ScanalyzeGug376RouteExecuteDispatchRecovery
                'Null':
                  dynamodb:LeadingKeys: 'true'
      Tags:
        - Key: managed_by
          Value: cloudformation
        - Key: service
          Value: scanalyze-platform-authority
        - Key: work_package
          Value: GUG-376
        - Key: component
          Value: gug376-route-broker
        - Key: environment
          Value: non-production
        - Key: production
          Value: 'false'
        - Key: source_commit
          Value: '@@SOURCE_COMMIT@@'

  CreatorLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: @@BROKER_DELETION_POLICY@@
    UpdateReplacePolicy: @@BROKER_UPDATE_REPLACE_POLICY@@
    Properties:
      LogGroupName: /aws/lambda/scanalyze-platform-authority-gug376-route-creator
      RetentionInDays: 30
      Tags:
        - Key: managed_by
          Value: cloudformation
        - Key: service
          Value: scanalyze-platform-authority
        - Key: work_package
          Value: GUG-376
        - Key: component
          Value: gug376-route-broker
        - Key: environment
          Value: non-production
        - Key: production
          Value: 'false'
        - Key: source_commit
          Value: '@@SOURCE_COMMIT@@'

  ExecutorLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: @@BROKER_DELETION_POLICY@@
    UpdateReplacePolicy: @@BROKER_UPDATE_REPLACE_POLICY@@
    Properties:
      LogGroupName: /aws/lambda/scanalyze-platform-authority-gug376-route-executor
      RetentionInDays: 30
      Tags:
        - Key: managed_by
          Value: cloudformation
        - Key: service
          Value: scanalyze-platform-authority
        - Key: work_package
          Value: GUG-376
        - Key: component
          Value: gug376-route-broker
        - Key: environment
          Value: non-production
        - Key: production
          Value: 'false'
        - Key: source_commit
          Value: '@@SOURCE_COMMIT@@'

  CreateDispatchRecoveryLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: @@BROKER_DELETION_POLICY@@
    UpdateReplacePolicy: @@BROKER_UPDATE_REPLACE_POLICY@@
    Properties:
      LogGroupName: /aws/lambda/scanalyze-platform-authority-gug376-route-create-dispatch-recovery
      RetentionInDays: 30
      Tags:
        - Key: managed_by
          Value: cloudformation
        - Key: service
          Value: scanalyze-platform-authority
        - Key: work_package
          Value: GUG-376
        - Key: component
          Value: gug376-route-broker
        - Key: environment
          Value: non-production
        - Key: production
          Value: 'false'
        - Key: source_commit
          Value: '@@SOURCE_COMMIT@@'

  ExecuteDispatchRecoveryLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: @@BROKER_DELETION_POLICY@@
    UpdateReplacePolicy: @@BROKER_UPDATE_REPLACE_POLICY@@
    Properties:
      LogGroupName: /aws/lambda/scanalyze-platform-authority-gug376-route-execute-dispatch-recovery
      RetentionInDays: 30
      Tags:
        - Key: managed_by
          Value: cloudformation
        - Key: service
          Value: scanalyze-platform-authority
        - Key: work_package
          Value: GUG-376
        - Key: component
          Value: gug376-route-broker
        - Key: environment
          Value: non-production
        - Key: production
          Value: 'false'
        - Key: source_commit
          Value: '@@SOURCE_COMMIT@@'

  CreatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ScanalyzeGug376RouteBrokerCreator
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ExactBrokerCreation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DenyOutsideRegion
                Effect: Deny
                Action: '*'
                Resource: '*'
                Condition:
                  StringNotEquals:
                    aws:RequestedRegion: us-east-1
              - Sid: DenyBeforeRouteWindow
                Effect: Deny
                Action: '*'
                Resource: '*'
                Condition:
                  DateLessThan:
                    aws:CurrentTime: '@@ROUTE_NOT_BEFORE@@'
              - Sid: DenyWritesAfterRoute
                Effect: Deny
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:TagResource
                  - dynamodb:PutItem
                Resource: '*'
                Condition:
                  DateGreaterThanEquals:
                    aws:CurrentTime: '@@ROUTE_NOT_AFTER@@'
              - Sid: DenyAfterRecovery
                Effect: Deny
                Action: '*'
                Resource: '*'
                Condition:
                  DateGreaterThanEquals:
                    aws:CurrentTime: '@@RECOVERY_NOT_AFTER@@'
              - Sid: WriteExactCreatorLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:us-east-1:042360977644:log-group:/aws/lambda/scanalyze-platform-authority-gug376-route-creator:*
              - Sid: WriteXrayTelemetry
                Effect: Allow
                Action:
                  - xray:PutTelemetryRecords
                  - xray:PutTraceSegments
                Resource: '*'
              - Sid: ReadCloseoutEvidence
                Effect: Allow
                Action:
                  - cloudtrail:LookupEvents
                  - s3:GetAccountPublicAccessBlock
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: us-east-1
                  DateGreaterThanEquals:
                    aws:CurrentTime: '@@ROUTE_NOT_BEFORE@@'
                  DateLessThan:
                    aws:CurrentTime: '@@RECOVERY_NOT_AFTER@@'
              - Sid: ReadExactPepStack
                Effect: Allow
                Action:
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:GetTemplate
                  - cloudformation:ListChangeSets
                  - cloudformation:ListStackResources
                Resource: !Sub arn:${AWS::Partition}:cloudformation:us-east-1:042360977644:stack/scanalyze-platform-authority-bootstrap-plan-repair-pep/*
                Condition:
                  StringEquals:
                    aws:RequestedRegion: us-east-1
                  DateGreaterThanEquals:
                    aws:CurrentTime: '@@ROUTE_NOT_BEFORE@@'
                  DateLessThan:
                    aws:CurrentTime: '@@RECOVERY_NOT_AFTER@@'
              - Sid: ReadExactPlanStackForCloseout
                Effect: Allow
                Action:
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:GetTemplate
                  - cloudformation:ListChangeSets
                  - cloudformation:ListStackResources
                Resource: !Sub arn:${AWS::Partition}:cloudformation:us-east-1:042360977644:stack/scanalyze-platform-authority-state-backend/*
                Condition:
                  StringEquals:
                    aws:RequestedRegion: us-east-1
                  DateGreaterThanEquals:
                    aws:CurrentTime: '@@ROUTE_NOT_BEFORE@@'
                  DateLessThan:
                    aws:CurrentTime: '@@RECOVERY_NOT_AFTER@@'
              - Sid: CreateExactPepInitialChangeSet
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:us-east-1:042360977644:stack/scanalyze-platform-authority-bootstrap-plan-repair-pep/*
                Condition: {StringEquals: {aws:RequestedRegion: us-east-1, cloudformation:ChangeSetName: gug376-plan-repair-pep-create, cloudformation:TemplateUrl: '@@PEP_TEMPLATE_URL@@'}, DateGreaterThanEquals: {aws:CurrentTime: '@@ROUTE_NOT_BEFORE@@'}, DateLessThan: {aws:CurrentTime: '@@ROUTE_NOT_AFTER@@'}}
              - Sid: CreateExactPepProtectionChangeSet
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:us-east-1:042360977644:stack/scanalyze-platform-authority-bootstrap-plan-repair-pep/*
                Condition: {StringEquals: {aws:RequestedRegion: us-east-1, cloudformation:ChangeSetName: gug376-plan-repair-pep-protection-enable, cloudformation:TemplateUrl: '@@PEP_PROTECTION_TEMPLATE_URL@@'}, DateGreaterThanEquals: {aws:CurrentTime: '@@ROUTE_NOT_BEFORE@@'}, DateLessThan: {aws:CurrentTime: '@@ROUTE_NOT_AFTER@@'}}
              - Sid: TagExactPepChangeSetOnCreate
                Effect: Allow
                Action: cloudformation:TagResource
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:us-east-1:042360977644:stack/scanalyze-platform-authority-bootstrap-plan-repair-pep/*
                  - !Sub arn:${AWS::Partition}:cloudformation:us-east-1:042360977644:changeSet/gug376-plan-repair-pep-create/*
                  - !Sub arn:${AWS::Partition}:cloudformation:us-east-1:042360977644:changeSet/gug376-plan-repair-pep-protection-enable/*
                Condition: {StringEquals: {aws:RequestedRegion: us-east-1, cloudformation:CreateAction: [CreateChangeSet, ExecuteChangeSet], aws:RequestTag/managed_by: cloudformation, aws:RequestTag/service: scanalyze-platform-authority, aws:RequestTag/work_package: GUG-376}, ForAllValues:StringEquals: {aws:TagKeys: [managed_by, service, work_package]}, DateGreaterThanEquals: {aws:CurrentTime: '@@ROUTE_NOT_BEFORE@@'}, DateLessThan: {aws:CurrentTime: '@@ROUTE_NOT_AFTER@@'}}
              - Sid: ReadExactPepInitialTemplate
                Effect: Allow
                Action: s3:GetObjectVersion
                Resource: !Sub arn:${AWS::Partition}:s3:::@@PEP_TEMPLATE_BUCKET@@/@@PEP_TEMPLATE_KEY@@
                Condition:
                  ForAnyValue:StringEquals:
                    aws:CalledVia: cloudformation.amazonaws.com
                  StringEquals:
                    aws:RequestedRegion: us-east-1
                    s3:VersionId: '@@PEP_TEMPLATE_VERSION@@'
                  DateGreaterThanEquals:
                    aws:CurrentTime: '@@ROUTE_NOT_BEFORE@@'
                  DateLessThan:
                    aws:CurrentTime: '@@RECOVERY_NOT_AFTER@@'
              - Sid: DecryptExactPepInitialTemplateKeyThroughS3
                Effect: Allow
                Action: kms:Decrypt
                Resource: '@@ARTIFACT_KMS_KEY_ARN@@'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: us-east-1
                    kms:ViaService: s3.us-east-1.amazonaws.com
                    kms:EncryptionContext:aws:s3:arn: !Sub arn:${AWS::Partition}:s3:::@@PEP_TEMPLATE_BUCKET@@
                  DateGreaterThanEquals:
                    aws:CurrentTime: '@@ROUTE_NOT_BEFORE@@'
                  DateLessThan:
                    aws:CurrentTime: '@@RECOVERY_NOT_AFTER@@'
              - Sid: ReadExactPepProtectionTemplate
                Effect: Allow
                Action: s3:GetObjectVersion
                Resource: !Sub arn:${AWS::Partition}:s3:::@@PEP_PROTECTION_TEMPLATE_BUCKET@@/@@PEP_PROTECTION_TEMPLATE_KEY@@
                Condition:
                  ForAnyValue:StringEquals:
                    aws:CalledVia: cloudformation.amazonaws.com
                  StringEquals:
                    aws:RequestedRegion: us-east-1
                    s3:VersionId: '@@PEP_PROTECTION_TEMPLATE_VERSION@@'
                  DateGreaterThanEquals:
                    aws:CurrentTime: '@@ROUTE_NOT_BEFORE@@'
                  DateLessThan:
                    aws:CurrentTime: '@@RECOVERY_NOT_AFTER@@'
              - Sid: DecryptExactPepProtectionTemplateKeyThroughS3
                Effect: Allow
                Action: kms:Decrypt
                Resource: '@@ARTIFACT_KMS_KEY_ARN@@'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: us-east-1
                    kms:ViaService: s3.us-east-1.amazonaws.com
                    kms:EncryptionContext:aws:s3:arn: !Sub arn:${AWS::Partition}:s3:::@@PEP_PROTECTION_TEMPLATE_BUCKET@@
                  DateGreaterThanEquals:
                    aws:CurrentTime: '@@ROUTE_NOT_BEFORE@@'
                  DateLessThan:
                    aws:CurrentTime: '@@RECOVERY_NOT_AFTER@@'
              - Sid: AssumeExactManagementCreator
                Effect: Allow
                Action:
                  - sts:AssumeRole
                  - sts:SetSourceIdentity
                Resource: !Sub arn:${AWS::Partition}:iam::839393571433:role/scanalyze/platform-authority/ScanalyzeGug376RouteBrokerCreator
                Condition:
                  DateGreaterThanEquals:
                    aws:CurrentTime: '@@ROUTE_NOT_BEFORE@@'
                  DateLessThan:
                    aws:CurrentTime: '@@RECOVERY_NOT_AFTER@@'
              - Sid: ReadAndCasBrokerLedger
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !Sub arn:${AWS::Partition}:dynamodb:us-east-1:042360977644:table/scanalyze-platform-authority-gug376-route-broker-ledger
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys: [gug376-route-broker]
                  'Null':
                    dynamodb:LeadingKeys: 'false'
              - Sid: ReadBrokerLedgerControlPlane
                Effect: Allow
                Action: dynamodb:DescribeTable
                Resource: !Sub arn:${AWS::Partition}:dynamodb:us-east-1:042360977644:table/scanalyze-platform-authority-gug376-route-broker-ledger
              - Sid: ReadExactRepairTerminalRecordsForCloseout
                Effect: Allow
                Action: dynamodb:GetItem
                Resource: !Sub arn:${AWS::Partition}:dynamodb:us-east-1:042360977644:table/scanalyze-platform-authority-plan-policy-repair-ledger
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys:
                      - '@@REPAIR_ID@@'
                      - '@@REPAIR_ID@@#reconcile-v1'
                  'Null':
                    dynamodb:LeadingKeys: 'false'
              - Sid: DenyExecutionAndDirectProviders
                Effect: Deny
                Action:
                  - cloudformation:ExecuteChangeSet
                  - iam:*
                  - identitystore:*
                  - lambda:*
                  - sso:*
                  - sts:AssumeRoleWithSAML
                  - sts:AssumeRoleWithWebIdentity
                Resource: '*'
              - Sid: DenyDirectKmsProviders
                Effect: Deny
                Action: kms:*
                Resource: '*'
                Condition:
                  ForAllValues:StringNotEquals:
                    aws:CalledVia:
                      - cloudformation.amazonaws.com
                      - s3.amazonaws.com
      Tags:
        - Key: managed_by
          Value: cloudformation
        - Key: service
          Value: scanalyze-platform-authority
        - Key: work_package
          Value: GUG-376
        - Key: component
          Value: gug376-route-broker
        - Key: environment
          Value: non-production
        - Key: production
          Value: 'false'
        - Key: source_commit
          Value: '@@SOURCE_COMMIT@@'

  ExecutorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ScanalyzeGug376RouteBrokerExecutor
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ExactBrokerExecution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DRegion
                Effect: Deny
                Action: '*'
                Resource: '*'
                Condition:
                  StringNotEquals:
                    aws:RequestedRegion: us-east-1
              - Sid: DBefore
                Effect: Deny
                Action: '*'
                Resource: '*'
                Condition:
                  DateLessThan:
                    aws:CurrentTime: '@@ROUTE_NOT_BEFORE@@'
              - Sid: DenyAfterRecovery
                Effect: Deny
                Action: '*'
                Resource: '*'
                Condition:
                  DateGreaterThanEquals:
                    aws:CurrentTime: '@@RECOVERY_NOT_AFTER@@'
              - Sid: L
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:us-east-1:042360977644:log-group:/aws/lambda/scanalyze-platform-authority-gug376-route-executor:*
              - Sid: X
                Effect: Allow
                Action:
                  - xray:PutTelemetryRecords
                  - xray:PutTraceSegments
                Resource: '*'
              - Sid: C
                Effect: Allow
                Action: cloudtrail:LookupEvents
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: us-east-1
              - Sid: ReadPep
                Effect: Allow
                Action:
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:GetTemplate
                  - cloudformation:ListChangeSets
                  - cloudformation:ListStackResources
                Resource: !Sub arn:${AWS::Partition}:cloudformation:us-east-1:042360977644:stack/scanalyze-platform-authority-bootstrap-plan-repair-pep/*
                Condition:
                  StringEquals:
                    aws:RequestedRegion: us-east-1
              - Sid: ExecutePep
                Effect: Allow
                Action: cloudformation:ExecuteChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:us-east-1:042360977644:stack/scanalyze-platform-authority-bootstrap-plan-repair-pep/*
                Condition:
                  StringEquals:
                    aws:RequestedRegion: us-east-1
                  StringLike:
                    cloudformation:ChangeSetName:
                      - !Sub arn:${AWS::Partition}:cloudformation:us-east-1:042360977644:changeSet/gug376-plan-repair-pep-create/*
                      - !Sub arn:${AWS::Partition}:cloudformation:us-east-1:042360977644:changeSet/gug376-plan-repair-pep-protection-enable/*
                  DateGreaterThanEquals:
                    aws:CurrentTime: '@@ROUTE_NOT_BEFORE@@'
                  DateLessThan:
                    aws:CurrentTime: '@@ROUTE_NOT_AFTER@@'
              - Sid: AssumeManagementExecutor
                Effect: Allow
                Action:
                  - sts:AssumeRole
                  - sts:SetSourceIdentity
                Resource: !Sub arn:${AWS::Partition}:iam::839393571433:role/scanalyze/platform-authority/ScanalyzeGug376RouteBrokerExecutor
              - Sid: ReadAndCasBrokerLedger
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !Sub arn:${AWS::Partition}:dynamodb:us-east-1:042360977644:table/scanalyze-platform-authority-gug376-route-broker-ledger
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys: [gug376-route-broker]
                  'Null':
                    dynamodb:LeadingKeys: 'false'
              - Sid: ReadBrokerLedgerControlPlane
                Effect: Allow
                Action: dynamodb:DescribeTable
                Resource: !Sub arn:${AWS::Partition}:dynamodb:us-east-1:042360977644:table/scanalyze-platform-authority-gug376-route-broker-ledger
              - Sid: PepRolesViaCfn
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListRoleTags
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::042360977644:role/ScanalyzeBootstrapPlanRepairPlan
                  - !Sub arn:${AWS::Partition}:iam::042360977644:role/ScanalyzeBootstrapPlanRepairExecution
                  - !Sub arn:${AWS::Partition}:iam::042360977644:role/ScanalyzeBootstrapPlanRepairReconcile
                  - !Sub arn:${AWS::Partition}:iam::042360977644:role/scanalyze/platform-authority/ScanalyzeBootstrapPlanRepairInspector
                Condition:
                  ForAnyValue:StringEquals:
                    aws:CalledVia: cloudformation.amazonaws.com
              - Sid: PPR
                Effect: Allow
                Action: iam:PassRole
                Resource:
