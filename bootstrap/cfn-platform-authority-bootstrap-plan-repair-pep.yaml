  RepairCodeSigningConfig:
    Type: AWS::Lambda::CodeSigningConfig
    Properties:
      Description: GUG-376 enforce-only reviewed plan policy repair signer
      AllowedPublishers:
        SigningProfileVersionArns:
          - !Ref SigningProfileVersionArn
      CodeSigningPolicies:
        UntrustedArtifactOnDeployment: Enforce
      Tags:
        - {Key: managed_by, Value: cloudformation}
        - {Key: service, Value: scanalyze-platform-authority}
        - {Key: work_package, Value: GUG-376}
        - {Key: environment, Value: non-production}
        - {Key: production, Value: 'false'}

  PlanFunction:
    Type: AWS::Lambda::Function
    DependsOn: [RepairLedger, PlanLogGroup]
    Properties:
      FunctionName: scanalyze-platform-authority-plan-policy-plan
      Description: GUG-376 read-only plan proof and create-only ledger gate
      Runtime: python3.12
      Handler: tooling.platform_authority_plan_permission_repair_aws.plan_handler
      Architectures: [x86_64]
      MemorySize: 1024
      Timeout: 300
      ReservedConcurrentExecutions: 1
      Role: !GetAtt PlanExecutionRole.Arn
      CodeSigningConfigArn: !Ref RepairCodeSigningConfig
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
        S3ObjectVersion: !Ref ArtifactVersion
      Environment:
        Variables:
          SOURCE_COMMIT: !Ref SourceCommit
          SOURCE_BUNDLE_DIGEST: !Ref SourceBundleDigest
          REPAIR_ID: !Ref RepairId
          PRINCIPAL_ID: !Ref PrincipalId
          IDENTITY_STORE_ID: !Ref IdentityStoreId
          IDENTITY_CENTER_INSTANCE_ARN: !Ref IdentityCenterInstanceArn
          PLAN_PERMISSION_SET_ARN: !Ref PlanPermissionSetArn
          EXPECTED_PERMISSION_SET_DESCRIPTION: !Ref ExpectedPermissionSetDescription
          REPAIR_INVOKER_PERMISSION_SET_ARN: !Ref RepairInvokerPermissionSetArn
          CURRENT_POLICY_DIGEST: !Ref CurrentPolicyDigest
          DESIRED_POLICY_DIGEST: !Ref DesiredPolicyDigest
          EXPECTED_PLAN_PERMISSION_SET_TAGS_JSON: !Ref ExpectedPlanPermissionSetTagsJson
          BOOTSTRAP_CHANGE_SET_NAME: !Ref BootstrapChangeSetName
          REPAIR_LEDGER_TABLE_NAME: !Ref RepairLedger
          REPAIR_LEDGER_KMS_KEY_ARN: !GetAtt RepairLedgerKey.Arn
          EXPECTED_ARTIFACT_CODE_SHA256: !Ref ArtifactCodeSha256
          EXPECTED_CODE_SIGNING_CONFIG_ARN: !Ref RepairCodeSigningConfig
          EXPECTED_SIGNING_PROFILE_VERSION_ARN: !Ref SigningProfileVersionArn
          REPAIR_NOT_BEFORE: !Ref RepairNotBefore
          REPAIR_NOT_AFTER: !Ref RepairNotAfter
          PLAN_SAML_PROVIDER_ARN: !Ref PlanSamlProviderArn
          IDENTITY_CENTER_KMS_MODE: !Ref IdentityCenterKmsMode
          IDENTITY_CENTER_KMS_KEY_ARN: !Ref IdentityCenterKmsKeyArn
          EXPECTED_BOTO3_VERSION: !Ref ExpectedBoto3Version
          EXPECTED_BOTOCORE_VERSION: !Ref ExpectedBotocoreVersion
          IMMU_CONFIG_DIGEST: !Ref ImmutableConfigurationDigest
      Tags:
        - {Key: managed_by, Value: cloudformation}
        - {Key: service, Value: scanalyze-platform-authority}
        - {Key: source_commit, Value: !Ref SourceCommit}
        - {Key: work_package, Value: GUG-376}
        - {Key: environment, Value: non-production}
        - {Key: production, Value: 'false'}

  PlanRuntimeManagementConfig:
    Type: AWS::Lambda::RuntimeManagementConfig
    Properties:
      FunctionName: !Ref PlanFunction
      UpdateRuntimeOn: FunctionUpdate

  PlanFunctionVersion:
    Type: AWS::Lambda::Version
    DependsOn: PlanRuntimeManagementConfig
    Properties:
      FunctionName: !Ref PlanFunction
      CodeSha256: !Ref ArtifactCodeSha256
      Description: !Sub 'GUG-376 plan version ${ImmutableConfigurationDigest}'

  PlanAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref PlanFunction
      FunctionVersion: !GetAtt PlanFunctionVersion.Version
      Name: plan-v1

  PlanEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    DependsOn: PlanAlias
    Properties:
      FunctionName: !Ref PlanFunction
      Qualifier: plan-v1
      MaximumEventAgeInSeconds: 60
      MaximumRetryAttempts: 0

  RepairFunction:
    Type: AWS::Lambda::Function
    DependsOn: [RepairLedger, RepairLogGroup]
    Properties:
      FunctionName: scanalyze-platform-authority-plan-policy-repair
      Description: GUG-376 exact one-shot bootstrap Plan inline-policy repair PEP
      Runtime: python3.12
      Handler: tooling.platform_authority_plan_permission_repair_aws.repair_handler
      Architectures: [x86_64]
      MemorySize: 1024
      Timeout: 600
      ReservedConcurrentExecutions: 1
      Role: !GetAtt RepairExecutionRole.Arn
