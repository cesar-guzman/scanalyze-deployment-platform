AWSTemplateFormatVersion: '2010-09-09'

Parameters:
  ManagementAccountId: {Type: String, Default: '839393571433', AllowedValues: ['839393571433']}
  AuthorityAccountId: {Type: String, Default: '042360977644', AllowedValues: ['042360977644']}
  SourceCommit:
    Type: String
    AllowedPattern: '^[a-f0-9]{40}$'
  IdentityCenterInstanceArn:
    Type: String
    AllowedPattern: '^arn:aws[a-z-]*:sso:::instance/ssoins-[A-Za-z0-9]{16}$'
  BootstrapPrincipalId:
    Type: String
    AllowedPattern: '^(?:[0-9a-f]{10}-)?[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$'
  SeedAssignmentsEnabled: {Type: String, AllowedValues: ['false', 'true']}
  BrokerInvokerAssignmentEnabled: {Type: String, AllowedValues: ['false', 'true']}
  RouteNotBefore:
    Type: String
    AllowedPattern: '^20[0-9]{2}-(0[1-9]|1[0-2])-([0-2][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]Z$'
  RouteNotAfter:
    Type: String
    AllowedPattern: '^20[0-9]{2}-(0[1-9]|1[0-2])-([0-2][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]Z$'
  RecoveryNotAfter: {Type: String, AllowedPattern: '^20[0-9]{2}-(0[1-9]|1[0-2])-([0-2][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]Z$'}
  ArtifactKmsKeyArn:
    Type: String
    AllowedPattern: '^arn:aws[a-z-]*:kms:us-east-1:042360977644:key/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
  RouteTemplateBucket:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  RouteTemplateKey:
    Type: String
    AllowedPattern: '^scanalyze/platform-authority/gug-376/plan-policy-repair/templates/[a-f0-9]{40}/cfn-platform-authority-gug376-temporary-change-set-route\.yaml$'
  RouteTemplateVersion: {Type: String, MinLength: 1, MaxLength: 1024}
  RouteTemplateUrl: {Type: String, MinLength: 1, MaxLength: 5120, AllowedPattern: '^https://[^ ]+[?]versionId=[^ ]+$'}
  DelegationTemplateBucket:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  DelegationTemplateKey:
    Type: String
    AllowedPattern: '^scanalyze/platform-authority/gug-376/plan-policy-repair/templates/[a-f0-9]{40}/cfn-platform-authority-bootstrap-plan-repair-delegation\.yaml$'
  DelegationTemplateVersion: {Type: String, MinLength: 1, MaxLength: 1024}
  DelegationTemplateUrl: {Type: String, MinLength: 1, MaxLength: 5120, AllowedPattern: '^https://[^ ]+[?]versionId=[^ ]+$'}
  BrokerSeedTemplateBucket:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  BrokerSeedTemplateKey:
    Type: String
    AllowedPattern: '^scanalyze/platform-authority/gug-376/plan-policy-repair/private/[a-f0-9]{40}/cfn-platform-authority-gug376-route-broker\.yaml$'
  BrokerSeedTemplateVersion: {Type: String, MinLength: 1, MaxLength: 1024}
  BrokerSeedTemplateUrl: {Type: String, MinLength: 1, MaxLength: 5120, AllowedPattern: '^https://[^ ]+[?]versionId=[^ ]+$'}
  BrokerProtectionTemplateBucket:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  BrokerProtectionTemplateKey:
    Type: String
    AllowedPattern: '^scanalyze/platform-authority/gug-376/plan-policy-repair/private/[a-f0-9]{40}/cfn-platform-authority-gug376-route-broker-protection\.yaml$'
  BrokerProtectionTemplateVersion: {Type: String, MinLength: 1, MaxLength: 1024}
  BrokerProtectionTemplateUrl: {Type: String, MinLength: 1, MaxLength: 5120, AllowedPattern: '^https://[^ ]+[?]versionId=[^ ]+$'}
  BrokerCodeBucket:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  BrokerCodeKey:
    Type: String
    AllowedPattern: '^scanalyze/platform-authority/gug-376/plan-policy-repair/broker/signed/[a-f0-9]{40}/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.zip$'
  BrokerCodeVersion: {Type: String, MinLength: 1, MaxLength: 1024}
  BrokerSigningProfileVersionArn:
    Type: String
    AllowedPattern: '^arn:aws[a-z-]*:signer:us-east-1:042360977644:/signing-profiles/[A-Za-z0-9_]{2,64}/[A-Za-z0-9]{10}$'

Rules:
  AccountAndRegionMustMatch:
    Assertions:
      - Assert: !Equals [!Ref AWS::AccountId, '839393571433']
      - Assert: !Equals [!Ref AWS::Region, us-east-1]

Conditions:
  CreateSeedAssignments: !Equals [!Ref SeedAssignmentsEnabled, 'true']
  CreateBrokerInvokerAssignment: !Equals [!Ref BrokerInvokerAssignmentEnabled, 'true']

Resources:
  ManagementBrokerCreatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ScanalyzeGug376RouteBrokerCreator
      Path: /scanalyze/platform-authority/
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {AWS: !Sub 'arn:${AWS::Partition}:iam::${AuthorityAccountId}:root'}, Action: [sts:AssumeRole, sts:SetSourceIdentity], Condition: {ArnEquals: {aws:PrincipalArn: !Sub 'arn:${AWS::Partition}:iam::${AuthorityAccountId}:role/ScanalyzeGug376RouteBrokerCreator'}, StringEquals: {sts:SourceIdentity: !Sub 'gug376-creator-${SourceCommit}'}, DateGreaterThanEquals: {aws:CurrentTime: !Ref RouteNotBefore}, DateLessThan: {aws:CurrentTime: !Ref RecoveryNotAfter}}}
      Policies:
        - PolicyName: ExactChangeSetCreation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadCreateEvents
                Effect: Allow
                Action: cloudtrail:LookupEvents
                Resource: '*'
                Condition: {StringEquals: {aws:RequestedRegion: us-east-1}, DateGreaterThanEquals: {aws:CurrentTime: !Ref RouteNotBefore}, DateLessThan: {aws:CurrentTime: !Ref RecoveryNotAfter}}
              - Sid: ReadExactManagementStacks
                Effect: Allow
                Action: [cloudformation:DescribeChangeSet, cloudformation:DescribeStackEvents, cloudformation:DescribeStacks, cloudformation:GetTemplate, cloudformation:ListChangeSets, cloudformation:ListStackResources]
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:us-east-1:${ManagementAccountId}:stack/scanalyze-platform-authority-gug376-temporary-change-set-route/*
                  - !Sub arn:${AWS::Partition}:cloudformation:us-east-1:${ManagementAccountId}:stack/scanalyze-platform-authority-bootstrap-plan-repair-delegation/*
                Condition: {StringEquals: {aws:RequestedRegion: us-east-1}, DateGreaterThanEquals: {aws:CurrentTime: !Ref RouteNotBefore}, DateLessThan: {aws:CurrentTime: !Ref RecoveryNotAfter}}
              - Sid: ReadExactIdentityCenterTerminalState
                Effect: Allow
                Action: [sso:DescribeAccountAssignmentCreationStatus, sso:DescribeAccountAssignmentDeletionStatus, sso:DescribePermissionSet, sso:DescribePermissionSetProvisioningStatus, sso:GetInlinePolicyForPermissionSet, sso:GetPermissionsBoundaryForPermissionSet, sso:ListAccountAssignments, sso:ListAccountAssignmentsForPrincipal, sso:ListAccountsForProvisionedPermissionSet, sso:ListCustomerManagedPolicyReferencesInPermissionSet, sso:ListManagedPoliciesInPermissionSet, sso:ListPermissionSetProvisioningStatus, sso:ListTagsForResource]
                Resource:
                  - !Ref IdentityCenterInstanceArn
                  - !Sub arn:${AWS::Partition}:sso:::permissionSet/ssoins-*/*
                  - !Sub arn:${AWS::Partition}:sso:::account/${ManagementAccountId}
                  - !Sub arn:${AWS::Partition}:sso:::account/${AuthorityAccountId}
                Condition: {StringEquals: {aws:RequestedRegion: us-east-1}, DateGreaterThanEquals: {aws:CurrentTime: !Ref RouteNotBefore}, DateLessThan: {aws:CurrentTime: !Ref RecoveryNotAfter}}
              - Sid: CreateExactRouteUpdateChangeSets
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:us-east-1:${ManagementAccountId}:stack/scanalyze-platform-authority-gug376-temporary-change-set-route/*
                Condition: {StringEquals: {aws:RequestedRegion: us-east-1, cloudformation:ChangeSetName: [gug376-temporary-route-seed-revoke, gug376-temporary-route-invoker-revoke], cloudformation:TemplateUrl: !Ref RouteTemplateUrl}, DateGreaterThanEquals: {aws:CurrentTime: !Ref RouteNotBefore}, DateLessThan: {aws:CurrentTime: !Ref RouteNotAfter}}
              - Sid: CreateExactDelegationChangeSets
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:us-east-1:${ManagementAccountId}:stack/scanalyze-platform-authority-bootstrap-plan-repair-delegation/*
                Condition: {StringEquals: {aws:RequestedRegion: us-east-1, cloudformation:ChangeSetName: [gug376-plan-repair-delegation-create, gug376-plan-repair-delegation-revoke], cloudformation:TemplateUrl: !Ref DelegationTemplateUrl}, DateGreaterThanEquals: {aws:CurrentTime: !Ref RouteNotBefore}, DateLessThan: {aws:CurrentTime: !Ref RouteNotAfter}}
              - Sid: TagM
                Effect: Allow
                Action: cloudformation:TagResource
                Resource: [!Sub 'arn:${AWS::Partition}:cloudformation:us-east-1:${ManagementAccountId}:stack/scanalyze-platform-authority-gug376-temporary-change-set-route/*', !Sub 'arn:${AWS::Partition}:cloudformation:us-east-1:${ManagementAccountId}:changeSet/gug376-temporary-route-seed-revoke/*', !Sub 'arn:${AWS::Partition}:cloudformation:us-east-1:${ManagementAccountId}:changeSet/gug376-temporary-route-invoker-revoke/*', !Sub 'arn:${AWS::Partition}:cloudformation:us-east-1:${ManagementAccountId}:stack/scanalyze-platform-authority-bootstrap-plan-repair-delegation/*', !Sub 'arn:${AWS::Partition}:cloudformation:us-east-1:${ManagementAccountId}:changeSet/gug376-plan-repair-delegation-create/*', !Sub 'arn:${AWS::Partition}:cloudformation:us-east-1:${ManagementAccountId}:changeSet/gug376-plan-repair-delegation-revoke/*']
                Condition: {StringEquals: {aws:RequestedRegion: us-east-1, cloudformation:CreateAction: [CreateChangeSet, ExecuteChangeSet], aws:RequestTag/managed_by: cloudformation, aws:RequestTag/service: scanalyze-platform-authority, aws:RequestTag/work_package: GUG-376}, ForAllValues:StringEquals: {aws:TagKeys: [managed_by, service, work_package]}, DateGreaterThanEquals: {aws:CurrentTime: !Ref RouteNotBefore}, DateLessThan: {aws:CurrentTime: !Ref RecoveryNotAfter}}
              - Sid: ReadExactRouteTemplate
                Effect: Allow
                Action: s3:GetObjectVersion
                Resource: !Sub arn:${AWS::Partition}:s3:::${RouteTemplateBucket}/${RouteTemplateKey}
                Condition:
                  ForAnyValue:StringEquals:
                    aws:CalledVia: cloudformation.amazonaws.com
                  StringEquals:
                    aws:RequestedRegion: us-east-1
                    s3:VersionId: !Ref RouteTemplateVersion
                  DateGreaterThanEquals:
                    aws:CurrentTime: !Ref RouteNotBefore
                  DateLessThan:
                    aws:CurrentTime: !Ref RecoveryNotAfter
              - Sid: ReadExactDelegationTemplate
                Effect: Allow
                Action: s3:GetObjectVersion
                Resource: !Sub arn:${AWS::Partition}:s3:::${DelegationTemplateBucket}/${DelegationTemplateKey}
                Condition:
                  ForAnyValue:StringEquals:
                    aws:CalledVia: cloudformation.amazonaws.com
                  StringEquals:
                    aws:RequestedRegion: us-east-1
                    s3:VersionId: !Ref DelegationTemplateVersion
                  DateGreaterThanEquals:
                    aws:CurrentTime: !Ref RouteNotBefore
                  DateLessThan:
                    aws:CurrentTime: !Ref RecoveryNotAfter
              - Sid: DecryptExactArtifactBucketKeyThroughS3
                Effect: Allow
                Action: kms:Decrypt
                Resource: !Ref ArtifactKmsKeyArn
                Condition:
                  StringEquals:
                    aws:RequestedRegion: us-east-1
                    kms:ViaService: s3.us-east-1.amazonaws.com
                    kms:EncryptionContext:aws:s3:arn: !Sub arn:${AWS::Partition}:s3:::${RouteTemplateBucket}
                  DateGreaterThanEquals:
                    aws:CurrentTime: !Ref RouteNotBefore
                  DateLessThan:
                    aws:CurrentTime: !Ref RecoveryNotAfter
              - Sid: D1
                Effect: Deny
                Action:
                  - cloudformation:ExecuteChangeSet
                  - iam:*
                  - identitystore:*
                  - lambda:*
                  - sts:AssumeRole
                  - sts:AssumeRoleWithSAML
                  - sts:AssumeRoleWithWebIdentity
                Resource: '*'
      Tags: [{Key: managed_by, Value: cloudformation}, {Key: service, Value: scanalyze-platform-authority}, {Key: work_package, Value: GUG-376}, {Key: component, Value: gug376-temporary-route}, {Key: environment, Value: non-production}, {Key: production, Value: 'false'}]

  ManagementBrokerExecutorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ScanalyzeGug376RouteBrokerExecutor
      Path: /scanalyze/platform-authority/
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {AWS: !Sub 'arn:${AWS::Partition}:iam::${AuthorityAccountId}:root'}, Action: [sts:AssumeRole, sts:SetSourceIdentity], Condition: {ArnEquals: {aws:PrincipalArn: !Sub 'arn:${AWS::Partition}:iam::${AuthorityAccountId}:role/ScanalyzeGug376RouteBrokerExecutor'}, StringEquals: {sts:SourceIdentity: !Sub 'gug376-executor-${SourceCommit}'}, DateGreaterThanEquals: {aws:CurrentTime: !Ref RouteNotBefore}, DateLessThan: {aws:CurrentTime: !Ref RecoveryNotAfter}}}
      Policies:
        - PolicyName: ExactChangeSetExecution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadExecutionEvents
                Effect: Allow
                Action: cloudtrail:LookupEvents
                Resource: '*'
                Condition: {StringEquals: {aws:RequestedRegion: us-east-1}, DateGreaterThanEquals: {aws:CurrentTime: !Ref RouteNotBefore}, DateLessThan: {aws:CurrentTime: !Ref RecoveryNotAfter}}
              - Sid: ReadExactManagementChangeSets
                Effect: Allow
                Action: [cloudformation:DescribeChangeSet, cloudformation:DescribeStackEvents, cloudformation:DescribeStacks, cloudformation:GetTemplate, cloudformation:ListChangeSets, cloudformation:ListStackResources]
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:us-east-1:${ManagementAccountId}:stack/scanalyze-platform-authority-gug376-temporary-change-set-route/*
                  - !Sub arn:${AWS::Partition}:cloudformation:us-east-1:${ManagementAccountId}:stack/scanalyze-platform-authority-bootstrap-plan-repair-delegation/*
                Condition: {StringEquals: {aws:RequestedRegion: us-east-1}, DateGreaterThanEquals: {aws:CurrentTime: !Ref RouteNotBefore}, DateLessThan: {aws:CurrentTime: !Ref RecoveryNotAfter}}
              - Sid: ReadExactIdentityCenterTerminalState
                Effect: Allow
                Action: [sso:DescribeAccountAssignmentCreationStatus, sso:DescribeAccountAssignmentDeletionStatus, sso:DescribePermissionSet, sso:DescribePermissionSetProvisioningStatus, sso:GetInlinePolicyForPermissionSet, sso:GetPermissionsBoundaryForPermissionSet, sso:ListAccountAssignments, sso:ListAccountAssignmentsForPrincipal, sso:ListAccountsForProvisionedPermissionSet, sso:ListCustomerManagedPolicyReferencesInPermissionSet, sso:ListManagedPoliciesInPermissionSet, sso:ListPermissionSetProvisioningStatus, sso:ListTagsForResource]
                Resource:
                  - !Ref IdentityCenterInstanceArn
                  - !Sub arn:${AWS::Partition}:sso:::permissionSet/ssoins-*/*
                  - !Sub arn:${AWS::Partition}:sso:::account/${ManagementAccountId}
                  - !Sub arn:${AWS::Partition}:sso:::account/${AuthorityAccountId}
                Condition: {StringEquals: {aws:RequestedRegion: us-east-1}, DateGreaterThanEquals: {aws:CurrentTime: !Ref RouteNotBefore}, DateLessThan: {aws:CurrentTime: !Ref RecoveryNotAfter}}
              - Sid: ExecuteExactRouteUpdates
                Effect: Allow
                Action: cloudformation:ExecuteChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:us-east-1:${ManagementAccountId}:stack/scanalyze-platform-authority-gug376-temporary-change-set-route/*
                Condition: {StringEquals: {aws:RequestedRegion: us-east-1}, StringLike: {cloudformation:ChangeSetName: [!Sub 'arn:${AWS::Partition}:cloudformation:us-east-1:${ManagementAccountId}:changeSet/gug376-temporary-route-seed-revoke/*', !Sub 'arn:${AWS::Partition}:cloudformation:us-east-1:${ManagementAccountId}:changeSet/gug376-temporary-route-invoker-revoke/*']}, DateGreaterThanEquals: {aws:CurrentTime: !Ref RouteNotBefore}, DateLessThan: {aws:CurrentTime: !Ref RouteNotAfter}}
              - Sid: ExecuteDelegation
                Effect: Allow
                Action: cloudformation:ExecuteChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:us-east-1:${ManagementAccountId}:stack/scanalyze-platform-authority-bootstrap-plan-repair-delegation/*
                Condition: {StringEquals: {aws:RequestedRegion: us-east-1}, StringLike: {cloudformation:ChangeSetName: [!Sub 'arn:${AWS::Partition}:cloudformation:us-east-1:${ManagementAccountId}:changeSet/gug376-plan-repair-delegation-create/*', !Sub 'arn:${AWS::Partition}:cloudformation:us-east-1:${ManagementAccountId}:changeSet/gug376-plan-repair-delegation-revoke/*']}, DateGreaterThanEquals: {aws:CurrentTime: !Ref RouteNotBefore}, DateLessThan: {aws:CurrentTime: !Ref RouteNotAfter}}
              - Sid: ManageExactDelegationRolesThroughCloudFormation
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListRoleTags
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${ManagementAccountId}:role/scanalyze/platform-authority/ScanalyzeBootstrapPlanRepairMutation
                  - !Sub arn:${AWS::Partition}:iam::${ManagementAccountId}:role/scanalyze/platform-authority/ScanalyzeBootstrapPlanRepairReadback
                Condition: {ForAnyValue:StringEquals: {aws:CalledVia: cloudformation.amazonaws.com}, StringEquals: {aws:RequestedRegion: us-east-1}, DateGreaterThanEquals: {aws:CurrentTime: !Ref RouteNotBefore}, DateLessThan: {aws:CurrentTime: !Ref RecoveryNotAfter}}
              - Sid: ManageDelegationPermissionSetThroughCloudFormation
                Effect: Allow
                Action:
                  - sso:CreateAccountAssignment
                  - sso:CreatePermissionSet
                  - sso:DeleteAccountAssignment
                  - sso:DeletePermissionSet
                  - sso:DescribeAccountAssignmentCreationStatus
                  - sso:DescribeAccountAssignmentDeletionStatus
                  - sso:DescribePermissionSet
                  - sso:DescribePermissionSetProvisioningStatus
                  - sso:GetInlinePolicyForPermissionSet
                  - sso:ListAccountAssignments
                  - sso:ListAccountAssignmentsForPrincipal
                  - sso:ListManagedPoliciesInPermissionSet
                  - sso:ListTagsForResource
                  - sso:ProvisionPermissionSet
                  - sso:PutInlinePolicyToPermissionSet
                  - sso:TagResource
                  - sso:UntagResource
                  - sso:UpdatePermissionSet
                Resource:
                  - !Ref IdentityCenterInstanceArn
                  - !Sub arn:${AWS::Partition}:sso:::permissionSet/ssoins-*/*
                  - !Sub arn:${AWS::Partition}:sso:::account/${AuthorityAccountId}
                Condition: {ForAnyValue:StringEquals: {aws:CalledVia: cloudformation.amazonaws.com}, StringEquals: {aws:RequestedRegion: us-east-1}, DateGreaterThanEquals: {aws:CurrentTime: !Ref RouteNotBefore}, DateLessThan: {aws:CurrentTime: !Ref RecoveryNotAfter}}
              - Sid: DenyDirectProviderAndCreation
                Effect: Deny
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - iam:*
                  - identitystore:*
                  - sso:CreateAccountAssignment
                  - sso:CreatePermissionSet
                  - sso:DeleteAccountAssignment
                  - sso:DeletePermissionSet
                  - sso:ProvisionPermissionSet
                  - sso:PutInlinePolicyToPermissionSet
                  - sso:TagResource
                  - sso:UntagResource
                  - sso:UpdatePermissionSet
                Resource: '*'
                Condition:
                  ForAllValues:StringNotEquals:
                    aws:CalledVia: cloudformation.amazonaws.com
              - Sid: D2
                Effect: Deny
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:DeleteStack
                  - cloudformation:UpdateStack
                  - iam:AttachRolePolicy
                  - iam:CreatePolicy
                  - iam:PassRole
                  - iam:PutUserPolicy
                  - lambda:*
                  - sts:AssumeRole
                  - sts:AssumeRoleWithSAML
                  - sts:AssumeRoleWithWebIdentity
                Resource: '*'
      Tags: [{Key: managed_by, Value: cloudformation}, {Key: service, Value: scanalyze-platform-authority}, {Key: work_package, Value: GUG-376}, {Key: component, Value: gug376-temporary-route}, {Key: environment, Value: non-production}, {Key: production, Value: 'false'}]

  BrokerSeedCreatorPermissionSet:
    Type: AWS::SSO::PermissionSet
    Properties:
      InstanceArn: !Ref IdentityCenterInstanceArn
      Name: ScanalyzeGug376BrokerSeedCreator
      SessionDuration: PT1H
      InlinePolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadSeedCreationEvent
            Effect: Allow
            Action: cloudtrail:LookupEvents
            Resource: '*'
            Condition: {StringEquals: {aws:RequestedRegion: us-east-1}, DateGreaterThanEquals: {aws:CurrentTime: !Ref RouteNotBefore}, DateLessThan: {aws:CurrentTime: !Ref RecoveryNotAfter}}
          - Sid: ReadExactBrokerStack
            Effect: Allow
            Action:
              - cloudformation:DescribeChangeSet
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStacks
              - cloudformation:GetTemplate
              - cloudformation:ListChangeSets
              - cloudformation:ListStackResources
            Resource: !Sub arn:${AWS::Partition}:cloudformation:us-east-1:${AuthorityAccountId}:stack/scanalyze-platform-authority-gug376-route-broker/*
            Condition: {StringEquals: {aws:RequestedRegion: us-east-1}, DateGreaterThanEquals: {aws:CurrentTime: !Ref RouteNotBefore}, DateLessThan: {aws:CurrentTime: !Ref RecoveryNotAfter}}
          - Sid: CreateExactParameterlessBrokerChangeSet
            Effect: Allow
            Action: cloudformation:CreateChangeSet
            Resource: !Sub arn:${AWS::Partition}:cloudformation:us-east-1:${AuthorityAccountId}:stack/scanalyze-platform-authority-gug376-route-broker/*
            Condition: {StringEquals: {aws:RequestedRegion: us-east-1, cloudformation:ChangeSetName: [gug376-route-broker-create, gug376-route-broker-create-recovery-1], cloudformation:TemplateUrl: !Ref BrokerSeedTemplateUrl}, DateGreaterThanEquals: {aws:CurrentTime: !Ref RouteNotBefore}, DateLessThan: {aws:CurrentTime: !Ref RouteNotAfter}}
          - Sid: CreateExactParameterlessBrokerProtectionChangeSet
            Effect: Allow
            Action: cloudformation:CreateChangeSet
            Resource: !Sub arn:${AWS::Partition}:cloudformation:us-east-1:${AuthorityAccountId}:stack/scanalyze-platform-authority-gug376-route-broker/*
            Condition: {StringEquals: {aws:RequestedRegion: us-east-1, cloudformation:ChangeSetName: [gug376-route-broker-protection-enable, gug376-route-broker-protection-enable-recovery-1], cloudformation:TemplateUrl: !Ref BrokerProtectionTemplateUrl}, DateGreaterThanEquals: {aws:CurrentTime: !Ref RouteNotBefore}, DateLessThan: {aws:CurrentTime: !Ref RouteNotAfter}}
          - Sid: TagB
            Effect: Allow
            Action: cloudformation:TagResource
            Resource: [!Sub 'arn:${AWS::Partition}:cloudformation:us-east-1:${AuthorityAccountId}:stack/scanalyze-platform-authority-gug376-route-broker/*', !Sub 'arn:${AWS::Partition}:cloudformation:us-east-1:${AuthorityAccountId}:changeSet/gug376-route-broker-create/*', !Sub 'arn:${AWS::Partition}:cloudformation:us-east-1:${AuthorityAccountId}:changeSet/gug376-route-broker-create-recovery-1/*', !Sub 'arn:${AWS::Partition}:cloudformation:us-east-1:${AuthorityAccountId}:changeSet/gug376-route-broker-protection-enable/*', !Sub 'arn:${AWS::Partition}:cloudformation:us-east-1:${AuthorityAccountId}:changeSet/gug376-route-broker-protection-enable-recovery-1/*']
            Condition: {StringEquals: {aws:RequestedRegion: us-east-1, cloudformation:CreateAction: [CreateChangeSet, ExecuteChangeSet], aws:RequestTag/managed_by: cloudformation, aws:RequestTag/service: scanalyze-platform-authority, aws:RequestTag/work_package: GUG-376}, ForAllValues:StringEquals: {aws:TagKeys: [managed_by, service, work_package]}, DateGreaterThanEquals: {aws:CurrentTime: !Ref RouteNotBefore}, DateLessThan: {aws:CurrentTime: !Ref RecoveryNotAfter}}
          - Sid: ReadExactParameterlessBrokerTemplate
            Effect: Allow
            Action: s3:GetObjectVersion
            Resource: !Sub arn:${AWS::Partition}:s3:::${BrokerSeedTemplateBucket}/${BrokerSeedTemplateKey}
            Condition:
              ForAnyValue:StringEquals:
                aws:CalledVia: cloudformation.amazonaws.com
              StringEquals:
                aws:RequestedRegion: us-east-1
                s3:VersionId: !Ref BrokerSeedTemplateVersion
              DateGreaterThanEquals:
                aws:CurrentTime: !Ref RouteNotBefore
              DateLessThan:
                aws:CurrentTime: !Ref RecoveryNotAfter
